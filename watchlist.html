<style>
/* ============================================================
 *  WATCHLIST — the scouting board.
 *  Stocks you're keeping an eye on, as cards: live price, today's
 *  move, the move since you added it, and a month of price. Add by
 *  typing a ticker or a company; one tap to trade or drop it.
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
body { overflow: hidden; color: #F4EEE6; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse 50% 50% at 80% 10%, rgba(127,209,199,0.10), transparent 70%), radial-gradient(ellipse 90% 80% at 50% 40%, #1A1511 0%, #0E0B09 72%); }
.wl { height: 100vh; max-width: 1240px; margin: 0 auto; padding: 3vh 3vw 2.4vh; display: flex; flex-direction: column; gap: 2vh; }
.wl-top { display: flex; align-items: center; gap: 1.4rem; flex-wrap: wrap; }
.wl-back { font: 700 0.78rem 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,238,230,0.55); text-decoration: none; }
.wl-back:hover { color: #F4EEE6; }
.wl-title { margin: 0; font: 900 clamp(2.8rem, 4.4vw, 3.8rem)/0.95 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; }
.wl-title::after { content: ''; display: block; width: 58%; height: 5px; margin-top: 4px; background: #7FD1C7; transform: skewX(-14deg); }
.wl-count { font: 700 0.8rem 'Inter', sans-serif; color: rgba(244,238,230,0.5); letter-spacing: 0.1em; text-transform: uppercase; }

/* add bar */
.wl-add { position: relative; margin-left: auto; width: min(420px, 100%); }
.wl-add input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; border-radius: 12px; outline: none;
    background: rgba(34,29,25,0.95); border: 1.5px solid rgba(244,238,230,0.14); color: #F4EEE6; font: 600 0.95rem 'Inter', sans-serif; }
.wl-add input:focus { border-color: #7FD1C7; box-shadow: 0 0 0 4px rgba(127,209,199,0.12); }
.wl-add svg { position: absolute; left: 0.9rem; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: rgba(244,238,230,0.45); }
.wl-sug { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; padding: 6px; border-radius: 12px;
    background: #211C18; border: 1px solid rgba(244,238,230,0.14); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.wl-sug button { width: 100%; display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.6rem; border: 0; border-radius: 8px; background: none; cursor: pointer; color: inherit; text-align: left; }
.wl-sug button:hover, .wl-sug button.on { background: rgba(127,209,199,0.12); }
.wl-sug b { font: 900 1.1rem 'Barlow Condensed', sans-serif; font-style: italic; min-width: 3.4rem; }
.wl-sug span { font: 600 0.8rem 'Inter', sans-serif; color: rgba(244,238,230,0.6); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wl-sug i { font: 800 0.7rem 'Inter', sans-serif; font-style: normal; color: #7FD1C7; }
.wl-sug .logo-tile { width: 26px !important; height: 26px !important; }

/* tools row */
.wl-tools { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.wl-chip { padding: 0.35rem 0.85rem; transform: skewX(-12deg); cursor: pointer; border: 1px solid rgba(244,238,230,0.14); background: rgba(244,238,230,0.04); color: rgba(244,238,230,0.7); }
.wl-chip span { display: inline-block; transform: skewX(12deg); font: 800 0.72rem 'Inter', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
.wl-chip.on { background: #7FD1C7; border-color: #7FD1C7; color: #0E0B09; }
.wl-quick { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
.wl-quick em { font: 700 0.72rem 'Inter', sans-serif; font-style: normal; color: rgba(244,238,230,0.45); margin-right: 0.2rem; }
.wl-quick button { padding: 0.3rem 0.65rem; border-radius: 999px; cursor: pointer; background: rgba(244,238,230,0.05); border: 1px dashed rgba(244,238,230,0.22); color: #F4EEE6; font: 800 0.74rem 'Inter', sans-serif; }
.wl-quick button:hover { border-style: solid; border-color: #7FD1C7; color: #7FD1C7; }

/* the board */
.wl-board { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 6px 4px 2px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; align-content: start; }
.wl-board::-webkit-scrollbar { width: 6px; } .wl-board::-webkit-scrollbar-thumb { background: rgba(244,238,230,0.14); }
.sc { --c: #9A8F84; position: relative; overflow: hidden; padding: 14px 16px 12px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(40,34,29,0.96), rgba(22,18,15,0.96)); border: 1px solid rgba(244,238,230,0.09);
    border-bottom: 4px solid color-mix(in srgb, var(--c) 55%, #0A0806); animation: scIn 0.4s cubic-bezier(0.2,0.9,0.3,1) both; animation-delay: calc(var(--i, 0) * 40ms);
    transition: transform 0.16s cubic-bezier(0.2,0.9,0.3,1.2), border-color 0.16s ease; }
.sc:hover { transform: translateY(-4px); border-color: rgba(244,238,230,0.2); border-bottom-color: color-mix(in srgb, var(--c) 55%, #0A0806); }
.sc.up { --c: #5CB88A; } .sc.down { --c: #D9645C; }
@keyframes scIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sc-top { display: flex; align-items: center; gap: 10px; }
.sc-top .logo-tile { width: 34px !important; height: 34px !important; flex-shrink: 0; }
.sc-sym { font: 900 1.5rem/1 'Barlow Condensed', sans-serif; font-style: italic; }
.sc-name { font: 600 0.7rem 'Inter', sans-serif; color: rgba(244,238,230,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.sc-x { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: rgba(244,238,230,0.35); font-size: 1.1rem; line-height: 1; }
.sc-x:hover { background: rgba(217,100,92,0.14); color: #E8867F; }
.sc-mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.6rem; margin-top: 10px; }
.sc-px { font: 800 1.9rem/1 'Barlow Condensed', sans-serif; font-style: italic; font-variant-numeric: tabular-nums; }
.sc-day { padding: 2px 8px; transform: skewX(-10deg); font: 800 0.78rem 'Inter', sans-serif; background: rgba(244,238,230,0.07); color: rgba(244,238,230,0.7); }
.sc.up .sc-day { background: rgba(92,184,138,0.16); color: #7BD3A6; } .sc.down .sc-day { background: rgba(217,100,92,0.16); color: #E8867F; }
.sc-spark { display: block; width: 100%; height: 46px; margin: 10px 0 6px; }
.sc-spark path.l { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sc-spark path.a { fill: color-mix(in srgb, var(--c) 14%, transparent); stroke: none; }
.sc-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
.sc-since { font: 600 0.72rem 'Inter', sans-serif; color: rgba(244,238,230,0.5); }
.sc-since b.up { color: #7BD3A6; } .sc-since b.down { color: #E8867F; } .sc-since b { color: #F4EEE6; }
.sc-trade { padding: 0.35rem 0.9rem; transform: skewX(-12deg); text-decoration: none; background: rgba(92,184,138,0.16); border: 1px solid rgba(92,184,138,0.45); }
.sc-trade span { display: inline-block; transform: skewX(12deg); font: 900 0.95rem 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; color: #7BD3A6; }
.sc-trade:hover { background: #5CB88A; } .sc-trade:hover span { color: #0E0B09; }

.wl-empty { grid-column: 1 / -1; text-align: center; padding: 8vh 1rem; }
.wl-empty h3 { margin: 0 0 0.4rem; font: 900 2rem 'Barlow Condensed', sans-serif; font-style: italic; text-transform: uppercase; }
.wl-empty p { margin: 0; color: rgba(244,238,230,0.6); font: 600 0.9rem 'Inter', sans-serif; }
.wl-legal { font: 500 0.64rem 'Inter', sans-serif; color: rgba(244,238,230,0.3); }
.wl-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 90; padding: 0.6rem 1rem; border-radius: 10px;
    background: #211C18; border: 1px solid rgba(127,209,199,0.4); font: 700 0.85rem 'Inter', sans-serif; transition: all 0.25s ease; pointer-events: none; }
.wl-toast.show { transform: translate(-50%, 0); opacity: 1; }
@media (max-width: 760px) { body { overflow: auto; } .wl { height: auto; } .wl-board { overflow: visible; } .wl-quick { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { .sc { animation: none; } }
</style>
</head>
<body>
<main class="wl">
    <div class="wl-top">
        <a class="wl-back" href="dashboard.html" data-back>&larr; Back</a>
        <div>
            <h1 class="wl-title">Watchlist</h1>
        </div>
        <span class="wl-count" id="wlCount"></span>
        <div class="wl-add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="wlInput" type="text" autocomplete="off" spellcheck="false" placeholder="Add a stock: ticker or company" aria-label="Add a stock">
            <div class="wl-sug" id="wlSug" hidden></div>
        </div>
    </div>
    <div class="wl-tools">
        <button class="wl-chip on" data-sort="move"><span>Biggest move</span></button>
        <button class="wl-chip" data-sort="since"><span>Since added</span></button>
        <button class="wl-chip" data-sort="az"><span>A&ndash;Z</span></button>
        <div class="wl-quick" id="wlQuick"></div>
    </div>
    <section class="wl-board" id="wlBoard" aria-live="polite"></section>
    <div class="wl-legal">Prices may be delayed. A simulation for education and entertainment. Not investment advice.</div>
</main>
<div class="wl-toast" id="wlToast"></div>

<script>
(function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const U = {}; (window.__U || []).forEach(u => { U[u.s] = u; });
    const META_KEY = 'ftWatchMeta';      // price and date when added, for lists kept on this device
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pct = n => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%';
    const loadMeta = () => { try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (e) { return {}; } };
    const saveMeta = m => { try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {} };
    let rows = [], sort = 'move';
    const spark = {};

    function toast(msg) {
        const t = $('wlToast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
    }

    async function load() {
        let list = [];
        try { list = await SL.getWatchlistDetailed(); } catch (e) {}
        const meta = loadMeta();
        const syms = list.map(r => r.symbol);
        let q = {};
        try { q = syms.length ? await stockDataService.getQuotes(syms) : {}; } catch (e) {}
        rows = list.map(r => {
            const live = q[r.symbol] || {};
            const price = live.price != null ? Number(live.price) : null;
            const m = meta[r.symbol] || {};
            const added = r.price_when_added != null ? Number(r.price_when_added) : (m.p != null ? Number(m.p) : price);
            if (r.price_when_added == null && m.p == null && price != null) { meta[r.symbol] = { p: price, at: Date.now() }; }
            const at = r.added_at ? new Date(r.added_at).getTime() : (m.at || Date.now());
            return { sym: r.symbol, name: (U[r.symbol] && U[r.symbol].n) || r.symbol, sector: (U[r.symbol] && U[r.symbol].se) || '',
                     price, day: live.change_pct != null ? Number(live.change_pct) : null,
                     since: added > 0 && price != null ? (price - added) / added * 100 : null, added, at };
        });
        saveMeta(meta);
        render();
        rows.forEach(r => { if (!spark[r.sym]) fetchSpark(r.sym); });
    }

    async function fetchSpark(sym) {
        spark[sym] = 'loading';
        try {
            const h = await stockDataService.getHistoricalData(sym, '1M');
            if (h && h.length > 2) { spark[sym] = h.map(p => p.close); paintSpark(sym); return; }
        } catch (e) {}
        spark[sym] = null;
    }
    function sparkPath(vals) {
        const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
        const pts = vals.map((v, i) => [i / (vals.length - 1) * 100, 44 - (v - lo) / span * 40]);
        const l = 'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' L');
        return { l, a: l + ' L100 46 L0 46 Z' };
    }
    function paintSpark(sym) {
        const svg = document.querySelector('.sc[data-sym="' + sym + '"] .sc-spark');
        const v = spark[sym];
        if (!svg || !Array.isArray(v)) return;
        const p = sparkPath(v);
        svg.innerHTML = '<path class="a" d="' + p.a + '"/><path class="l" d="' + p.l + '"/>';
    }

    function render() {
        const board = $('wlBoard');
        $('wlCount').textContent = rows.length ? rows.length + (rows.length === 1 ? ' stock' : ' stocks') : '';
        paintQuick();
        if (!rows.length) {
            board.innerHTML = '<div class="wl-empty"><h3>Nothing on the board</h3></div>';
            return;
        }
        const list = rows.slice().sort((a, b) =>
            sort === 'az' ? a.sym.localeCompare(b.sym)
          : sort === 'since' ? (b.since || -1e9) - (a.since || -1e9)
          : Math.abs(b.day || 0) - Math.abs(a.day || 0));
        board.innerHTML = '';
        list.forEach((r, i) => {
            const el = document.createElement('article');
            el.className = 'sc ' + (r.day == null ? '' : r.day > 0.005 ? 'up' : r.day < -0.005 ? 'down' : '');
            el.dataset.sym = r.sym;
            el.style.setProperty('--i', i);
            const days = Math.max(0, Math.floor((Date.now() - r.at) / 86400000));
            el.innerHTML =
                '<div class="sc-top">' + (window.logoHtml ? logoHtml(r.sym, r.sector) : '') +
                    '<div><div class="sc-sym">' + esc(r.sym) + '</div><div class="sc-name">' + esc(r.name) + '</div></div>' +
                    '<button class="sc-x" title="Remove from watchlist" aria-label="Remove ' + esc(r.sym) + '">&times;</button></div>' +
                '<div class="sc-mid"><span class="sc-px">' + (r.price != null ? '$' + r.price.toFixed(2) : '&mdash;') + '</span>' +
                    '<span class="sc-day">' + (r.day != null ? pct(r.day) + ' today' : 'no quote') + '</span></div>' +
                '<svg class="sc-spark" viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true"></svg>' +
                '<div class="sc-foot"><span class="sc-since">' +
                    (r.since != null ? '<b class="' + (r.since >= 0 ? 'up' : 'down') + '">' + pct(r.since) + '</b> since added' : 'Tracking from today') +
                    (days ? ' · ' + days + 'd' : '') + '</span>' +
                    '<a class="sc-trade" href="trading.html?symbol=' + encodeURIComponent(r.sym) + '"><span>Trade</span></a></div>';
            el.querySelector('.sc-x').onclick = () => remove(r.sym);
            board.appendChild(el);
            paintSpark(r.sym);
        });
    }

    async function add(sym) {
        sym = String(sym || '').trim().toUpperCase();
        if (!/^[A-Z.\-^]{1,10}$/.test(sym)) { toast('That doesn’t look like a ticker'); return; }
        if (rows.some(r => r.sym === sym)) { toast(sym + ' is already on your board'); return; }
        try { await SL.addToWatchlist(sym); } catch (e) { toast('Couldn’t add ' + sym); return; }
        try {
            const q = await stockDataService.getQuotes([sym]);
            const m = loadMeta(); if (q[sym] && q[sym].price != null && !m[sym]) { m[sym] = { p: Number(q[sym].price), at: Date.now() }; saveMeta(m); }
        } catch (e) {}
        toast(sym + ' added');
        $('wlInput').value = ''; hideSug();
        load();
    }
    async function remove(sym) {
        try { await SL.removeFromWatchlist(sym); } catch (e) {}
        const m = loadMeta(); delete m[sym]; saveMeta(m);
        rows = rows.filter(r => r.sym !== sym);
        render();
        toast(sym + ' removed');
    }

    function paintQuick() {
        const have = new Set(rows.map(r => r.sym));
        const picks = ['NVDA', 'AAPL', 'MSFT', 'AMZN', 'TSLA', 'META', 'GOOGL', 'JPM'].filter(s => !have.has(s)).slice(0, 5);
        $('wlQuick').innerHTML = picks.length ? '<em>Quick add</em>' + picks.map(s => '<button data-q="' + s + '">+ ' + s + '</button>').join('') : '';
        $('wlQuick').querySelectorAll('button').forEach(b => b.onclick = () => add(b.dataset.q));
    }

    // search as you type, from the local universe (instant) with Yahoo as backup
    let sugAt = -1, sugList = [];
    function hideSug() { $('wlSug').hidden = true; sugAt = -1; }
    function showSug(list) {
        sugList = list; sugAt = list.length ? 0 : -1;
        const box = $('wlSug');
        if (!list.length) { hideSug(); return; }
        box.innerHTML = list.map((x, i) => '<button data-s="' + esc(x.symbol) + '" class="' + (i === 0 ? 'on' : '') + '">' +
            (window.logoHtml ? logoHtml(x.symbol, x.sector) : '') + '<b>' + esc(x.symbol) + '</b><span>' + esc(x.name || '') + '</span><i>+ Add</i></button>').join('');
        box.querySelectorAll('button').forEach(b => b.onmousedown = e => { e.preventDefault(); add(b.dataset.s); });
        box.hidden = false;
    }
    function localSearch(q) {
        const Q = q.toUpperCase(), low = q.toLowerCase();
        const uni = window.DRAFT_UNIVERSE || [];
        const exact = uni.filter(u => u.symbol === Q);
        const pre = uni.filter(u => u.symbol !== Q && u.symbol.startsWith(Q));
        const name = uni.filter(u => !u.symbol.startsWith(Q) && (u.name || '').toLowerCase().includes(low));
        return exact.concat(pre.sort((a, b) => a.symbol.length - b.symbol.length), name).slice(0, 7)
            .map(u => ({ symbol: u.symbol, name: u.name, sector: u.sector }));
    }
    let typing = null;
    $('wlInput').addEventListener('input', e => {
        const q = e.target.value.trim();
        if (!q) { hideSug(); return; }
        const local = localSearch(q);
        showSug(local);
        clearTimeout(typing);
        if (local.length < 3) typing = setTimeout(async () => {
            try {
                const more = await stockDataService.searchStocks(q);
                if ($('wlInput').value.trim() !== q) return;
                const seen = new Set(local.map(x => x.symbol));
                showSug(local.concat((more || []).filter(x => x && x.symbol && !seen.has(x.symbol) && !/[.]/.test(x.symbol))).slice(0, 7));
            } catch (err) {}
        }, 280);
    });
    $('wlInput').addEventListener('keydown', e => {
        const btns = [...$('wlSug').querySelectorAll('button')];
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (!btns.length) return; e.preventDefault();
            sugAt = (sugAt + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
            btns.forEach((b, i) => b.classList.toggle('on', i === sugAt));
        } else if (e.key === 'Enter') {
            e.preventDefault();
            add(sugAt >= 0 && sugList[sugAt] ? sugList[sugAt].symbol : e.target.value);
        } else if (e.key === 'Escape') hideSug();
    });
    $('wlInput').addEventListener('blur', () => setTimeout(hideSug, 120));

    document.querySelectorAll('.wl-chip').forEach(c => c.onclick = () => {
        sort = c.dataset.sort;
        document.querySelectorAll('.wl-chip').forEach(x => x.classList.toggle('on', x === c));
        render();
    });

    (async function () {
        for (let i = 0; i < 30 && !(window.SL && typeof stockDataService !== 'undefined'); i++) await new Promise(r => setTimeout(r, 100));
        load();
        setInterval(load, 60000);
    })();
})();
