/* ══════════════════════════════════════════════════════════════
   THE WHITFIELD ENDOWMENT — a story about other people's money

const S = {
    year: 0, value: 20.0, paid: 0, trust: 60,
    spendRule: null,          // 'fixed' | 'smooth' | 'band'
    alloc: null,              // {eq, bd, alt, label}
    crypto: 0,                // % sleeve
    building: false,          // accepted illiquid gift
    crashMove: null,          // 'cash' | 'rebalance' | 'cut'
    reentered: null,
    history: [{ x: 'Start', v: 20.0 }],
    lessons: [],
};
const fmtM = v => '$' + v.toFixed(1) + 'M';
function hud() {
    document.getElementById('hYear').textContent = S.year;
    document.getElementById('hVal').textContent = fmtM(S.value);
    document.getElementById('hPaid').textContent = fmtM(S.paid);
    const t = document.getElementById('hTrust');
    t.style.width = Math.max(4, Math.min(100, S.trust)) + '%';
    t.style.background = S.trust >= 55 ? '#5CB88A' : S.trust >= 35 ? '#E0A24C' : '#D9645C';
}

/* ── scripted market years (the lesson engine) ── */
function yearReturn(eq, bd, alt, yr) {
    // per-asset scripted returns by story year
    const R = {
        1: { eq: 0.14, bd: 0.035, alt: 0.07, cr: 1.2 },
        2: { eq: -0.32, bd: 0.07, alt: -0.12, cr: -0.70 },
        3: { eq: 0.26, bd: 0.02, alt: 0.09, cr: 0.60 },
        4: { eq: 0.11, bd: 0.03, alt: 0.06, cr: -0.15 },
    }[yr] || { eq: 0.08, bd: 0.03, alt: 0.06, cr: 0.10 };
    return { R, port: eq * R.eq + bd * R.bd + alt * R.alt };
}
function spendAmount() {
    if (S.spendRule === 'fixed') return S.value * 0.05;
    if (S.spendRule === 'smooth') {
        const last3 = S.history.slice(-3).map(h => h.v);
        return (last3.reduce((a, b) => a + b, 0) / last3.length) * 0.05;
    }
    return Math.min(Math.max(S.value * 0.05, 0.8), 1.15); // band: $0.8M floor, $1.15M cap
}
function stepYear(extraEq) {
    S.year++;
    const a = S.alloc;
    const crypto = S.crypto / 100;
    const eq = a.eq * (1 - crypto), bd = a.bd * (1 - crypto), alt = a.alt * (1 - crypto);
    const { R, port } = yearReturn(eq, bd, alt, S.year);
    let ret = port + crypto * R.cr + (extraEq || 0);
    S.value = S.value * (1 + ret);
    const draw = spendAmount();
    S.value -= draw; S.paid += draw;
    if (S.building && S.year === 2) S.value -= 0.35; // forced cheap sale of part of the building for liquidity
    S.history.push({ x: 'Yr ' + S.year, v: +S.value.toFixed(2) });
    return { ret, draw, R };
}

/* ── engine ── */
let chart;
function render(id) {
    const sc = SCENES[id];
    const stage = document.getElementById('stage');
    stage.innerHTML = `<div class="scene">
        ${sc.art ? '<div class="art">' + ART[sc.art] + '</div>' : ''}
        <div class="panel">
            <div class="kicker">${sc.kicker || ''}</div>
            <h2>${sc.title}</h2>
            ${typeof sc.body === 'function' ? sc.body() : sc.body}
            ${sc.chart ? '<div class="chartbox"><div class="cb-t">Endowment value</div><div class="cwrap"><canvas id="expChart"></canvas></div></div>' : ''}
            <div class="choices">${(sc.choices || []).map((c, i) =>
                `<button class="choice" onclick="pick('${id}', ${i})"><div class="ct">${c.t}</div><div class="cs">${c.s || ''}</div></button>`).join('')}</div>
            <div class="outcome" id="outcome"><div class="ot" id="outT"></div><div class="ob" id="outB"></div>
                <button class="go-on" id="goOn">Continue →</button></div>
        </div>
    </div>`;
    if (sc.chart) drawChart();
    hud();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function drawChart() {
    const c = document.getElementById('expChart'); if (!c || !window.Chart) return;
    if (chart) { try { chart.destroy(); } catch (e) {} }
    const up = S.history[S.history.length - 1].v >= 20;
    chart = new Chart(c, { type: 'line',
        data: { labels: S.history.map(h => h.x), datasets: [{ data: S.history.map(h => h.v),
            borderColor: up ? '#5CB88A' : '#D9645C', backgroundColor: 'rgba(92,184,138,0.08)', fill: true,
            borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: '#E0A24C', tension: 0.25 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false },
            tooltip: { callbacks: { label: x => '$' + x.parsed.y.toFixed(1) + 'M' } } },
            scales: { y: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: 'rgba(255,255,255,.5)', callback: v => '$' + v + 'M' } },
                      x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,.45)' } } } } });
}
window.pick = function (id, i) {
    const c = SCENES[id].choices[i];
    const res = c.fx ? c.fx() : {};
    document.querySelectorAll('.choice').forEach(b => b.disabled = true, b => b.style.opacity = 0.4);
    document.querySelectorAll('.choice').forEach((b, j) => { if (j !== i) b.style.opacity = 0.35; else b.style.borderColor = '#E0A24C'; });
    const out = document.getElementById('outcome');
    out.className = 'outcome show' + (res.bad ? ' bad' : '');
    document.getElementById('outT').textContent = res.bad ? 'What happens' : 'What happens';
    document.getElementById('outB').innerHTML = res.text || '';
    document.getElementById('goOn').onclick = () => render(res.go || c.go);
    hud();
    out.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

ips: { kicker: 'Chapter two · The rulebook', title: 'Write the spending rule before the first trade',
body: `
<p>Before allocating a cent, you draft the <b>Investment Policy Statement</b> — the constitution that will make decisions when everyone (including you) is scared. The heart of it is the spending rule: how the $1M draw actually gets calculated. This one paragraph will matter more than any stock you ever pick.</p>
<p>Three standard designs are on the table:</p>`,
choices: [
    { t: 'Fixed 5% of current market value, every year', s: 'Simple. But the payout crashes exactly when markets do.', fx: () => { S.spendRule = 'fixed'; S.lessons.push(['Spending rules', 'A fixed %-of-market-value rule transmits every crash directly into the school\'s budget — the year the endowment fell, scholarships got cut too. Smoothing exists to break that link.']); return { text: 'Clean and common. But notice what you signed: if the endowment drops 30%, the school\'s income drops 30% <i>in the same year</i> — the portfolio\'s worst moment becomes the students\' worst moment. Endowments call this "spending volatility," and you\'ve just bought the maximum amount of it.', go: 'alloc' }; } },
    { t: '5% of the trailing 3-year average value', s: 'The classic endowment smoothing rule.', fx: () => { S.spendRule = 'smooth'; S.trust += 5; S.lessons.push(['Spending rules', 'Your 3-year smoothing rule meant the crash reached the school\'s budget slowly and partially — the single most protective decision of the whole simulation.']); return { text: 'The institutional standard, and for good reason: averaging over three years means one terrible market year only moves the payout by a third of the damage, a year late. The school can plan; the portfolio gets time to heal. Dan the CFO actually smiles. <b>Trust rises.</b>', go: 'alloc' }; } },
    { t: '5% with a floor of $800k and a cap of $1.15M', s: 'A corridor: never starve the school, never overfeed it.', fx: () => { S.spendRule = 'band'; S.trust += 3; S.lessons.push(['Spending rules', 'Your floor-and-cap corridor guaranteed scholarships a minimum in the crash — paid for by capping the boom-year draws. Corridors trade upside for survivability.']); return { text: 'A corridor rule: the school always gets at least $800k (scholarships survive anything) and never more than $1.15M (boom years build the buffer instead of inflating the budget). Slightly complex, deeply humane. Dan asks for it in writing immediately.', go: 'alloc' }; } },
], },

alloc: { kicker: 'Chapter two · The allocation', title: 'Now — and only now — the portfolio',
body: `
<p>With the spending rule signed, you design the machine that funds it. The menu below is simplified to three dials: <b>equities</b> (growth engine, violent), <b>bonds</b> (shock absorber, pays the bills), <b>real assets/alts</b> (inflation defense). Remember what you know: $1M must come out every year, the board fired someone for panic-selling in 2009, and Brad benchmarks you against Milton Prep.</p>`,
choices: [
    { t: 'GROWTH — 75% equities · 20% bonds · 5% alts', s: 'Endowments are forever; act like it.', fx: () => { S.alloc = { eq: 0.75, bd: 0.20, alt: 0.05, label: 'Growth 75/20/5' }; return { text: 'The Yale-ish argument: an infinite horizon should hold maximum growth assets and treat crashes as noise. True for the <i>portfolio</i> — but your spending rule makes the horizon partly finite: $1M leaves every year regardless. You\'ve built high performance with a thin cushion. We\'ll see.', go: 'y1' }; } },
    { t: 'BALANCED — 60% equities · 30% bonds · 10% alts', s: 'Growth with a real shock absorber.', fx: () => { S.alloc = { eq: 0.60, bd: 0.30, alt: 0.10, label: 'Balanced 60/30/10' }; S.trust += 3; return { text: 'The textbook institutional build: enough equity to outgrow inflation plus spending, enough bonds to fund ~6 years of draws without ever selling stocks in a panic. It will lag in manias and shine in storms — which is the design, not a flaw.', go: 'y1' }; } },
    { t: 'PRESERVATION — 40% equities · 55% bonds · 5% alts', s: 'The grandfather said don\'t lose it.', fx: () => { S.alloc = { eq: 0.40, bd: 0.55, alt: 0.05, label: 'Preservation 40/55/5' }; return { text: 'Safe-feeling — and quietly risky in a different currency. At 5% spending plus ~2.5% inflation, this portfolio needs ~7.5% a year to hold its real value; a 40% equity mix has rarely delivered that. You\'ve traded crash risk for <b>erosion risk</b>: the slow kind nobody gets fired for until it\'s too late.', go: 'y1' }; } },
    { t: 'SWING — 90% equities · 5% bonds · 5% alts', s: 'Beat Milton Prep. Decisively.', fx: () => { S.alloc = { eq: 0.90, bd: 0.05, alt: 0.05, label: 'Swing 90/5/5' }; S.trust -= 5; return { bad: true, text: 'Brad loves it. Dan turns grey: with $1M leaving annually, a 35% equity crash would force you to sell stocks <i>at the bottom</i> just to make the scholarship payments — converting a temporary loss into a permanent one. You\'ve stapled the spending problem to the riskiest possible engine. <b>Dan\'s trust wavers.</b>', go: 'y1' }; } },
], },

y1: { chart: true, kicker: 'Chapter three · Year one', title: () => 'A good year — the most dangerous kind',
body: () => {
    const r = stepYear();
    S._y1 = r;
    const pct = (r.ret * 100).toFixed(1);
    let react;
    if (S.alloc.eq >= 0.9) { S.trust += 6; react = '<div class="say"><span class="who">Brad</span>"THIS is what I\'m talking about. Milton Prep did nine-something. We should lean in harder."</div><p>You are now the committee\'s genius. Remember this feeling; it has a half-life.</p>'; }
    else if (S.alloc.eq <= 0.4) { S.trust -= 7; react = '<div class="say"><span class="who">Brad</span>"Milton Prep\'s endowment returned 11.4%. We did ' + pct + '. Can someone explain why we\'re paying for underperformance?"</div><p>Marjorie defends you — "we hired discipline, not a lottery ticket" — but you can feel the scoreboard problem starting. Conservative portfolios must survive their own good markets.</p>'; }
    else { S.trust += 3; react = '<p>The committee is calm — the best possible reaction. Marjorie asks one good question ("what would this have done in 2008?") and moves to the roof budget. Boring meetings are what success sounds like.</p>'; }
    return `<p>Markets cooperate: equities +14%, bonds +3.5%. Your <b>${S.alloc.label}</b> portfolio returns <b>${pct}%</b>, and the school receives its <b>${fmtM(r.draw)}</b> draw on schedule. The endowment stands at <b>${fmtM(S.value)}</b>.</p>` + react;
},
choices: [ { t: 'On to the annual meeting…', s: '', fx: () => ({ text: 'Year one closes. Then Brad asks for "five minutes on an opportunity."', go: 'crypto' }) } ], },

crypto: { kicker: 'Chapter three · The temptation', title: 'Brad has a deck',
body: `
<p>Fourteen slides, dark mode, a rocket on slide three. The <b>"Digital Assets Opportunity Fund"</b> run by Brad's former roommate returned <b>+120%</b> last year. Brad moves that Whitfield allocate 10% of the endowment. "Milton Prep is <i>looking into it</i>," he adds, which is trustee for <i>I heard it at a dinner</i>.</p>
<div class="say"><span class="who">Marjorie</span>"I don't understand it, which worries me. But I didn't understand the internet either. What do you recommend?"</div>`,
choices: [
    { t: 'Decline — and teach the committee why in one page', s: 'Volatility math, custody risk, fee stack, no yield.', fx: () => { S.crypto = 0; S.trust += 6; S.lessons.push(['Speculative sleeves', 'You declined the +120% fund at the top. A year later it was −70%. The hardest part of institutional investing is that discipline looks like cowardice at every market top.']); return { text: 'You write one page: an asset with 70-80% drawdown history cannot sit inside a fund with a hard $1M annual liability; the fund\'s 2-and-20 fee stack consumes the diversification argument; custody is an unresolved question for a fiduciary. Brad calls it "boomer thinking." Marjorie files your memo. <b>Watch what happens next year.</b>', go: 'gift' }; } },
    { t: 'Allocate a contained 2% sleeve', s: 'Small enough to survive, big enough to learn.', fx: () => { S.crypto = 2; S.trust += 2; S.lessons.push(['Speculative sleeves', 'Your 2% crypto sleeve fell ~70% in the crash — costing ~1.4% of the endowment. Painful, survivable, and educational: sleeve sizing is what turns a blowup into a tuition payment.']); return { text: 'The diplomatic middle: 2% ($400k), documented as a satellite position with a written thesis and an exit rule. If it zeroes, the endowment loses less than a mediocre quarter; if Brad\'s roommate is right, it matters. Marjorie appreciates that the number came with a memo.', go: 'gift' }; } },
    { t: 'Follow the momentum — allocate the full 10%', s: '+120% speaks for itself.', fx: () => { S.crypto = 10; S.trust -= 8; S.lessons.push(['Speculative sleeves', 'The 10% crypto allocation lost ~70% in the crash — about 7% of the entire endowment, roughly TWO YEARS of scholarships, gone into an asset chosen from a trustee\'s slide deck.']); return { bad: true, text: '$2 million of scholarship money goes into the roommate\'s fund, at the top, after the +120% year — the precise pattern (performance-chasing into an illiquid vehicle) that kills institutional portfolios. Dan documents his objection in the minutes. Remember that detail.', go: 'gift' }; } },
], },

gift: { kicker: 'Chapter four · Strings attached', title: 'A donor calls with a building',
body: `
<p>An alum wants to donate a <b>$3M office building</b> to the endowment — generous, and complicated. It's 60% leased, needs a roof within five years, and the gift agreement says it <b>cannot be sold for a decade</b>. Dan is already doing liquidity math on a napkin.</p>`,
choices: [
    { t: 'Accept with gratitude — $3M is $3M', s: 'The endowment grows 15% in one phone call.', fx: () => { S.building = true; S.value += 3; S.history[S.history.length - 1].v = +S.value.toFixed(2); S.lessons.push(['Illiquid gifts', 'The building added $3M on paper — and during the crash it produced no sellable value while consuming repair cash. Illiquid assets are worth less than their appraisal to a fund with annual obligations.']); return { text: 'The endowment jumps to ' + fmtM(S.value) + ' on paper. But notice what you actually bought: an asset that pays partial rent, needs capital, and CANNOT be sold when you most need money. In good times it\'s a gift. In a liquidity crunch it\'s a passenger who can\'t swim.', go: 'y2crash' }; } },
    { t: 'Negotiate: accept only if the no-sale clause is dropped', s: 'Gifts serve the mission, not the donor\'s attachment.', fx: () => { S.trust += 6; S.lessons.push(['Illiquid gifts', 'You negotiated the restriction off the donated building (then politely sold it). Fiduciaries accept gifts on the fund\'s terms — a restricted asset is a smaller gift than its price tag claims.']); return { text: 'Awkward for exactly one phone call. The donor\'s lawyer huffs; the donor, who mostly wants his name on the atrium, agrees. You accept the building, sell it in eight months at $2.9M, and the endowment gets <i>usable</i> money. Marjorie learns something about you: you can say a polite no to $3 million. <b>Trust rises.</b>', go: 'y2crash' }; } },
    { t: 'Decline the gift entirely', s: 'Too messy for a fund this size.', fx: () => { S.trust -= 3; return { bad: true, text: 'Defensible on pure portfolio logic — but you turned down ~$2.9M of realizable value because negotiating felt uncomfortable, and the development office is now furious with the finance office. Fiduciary duty includes doing the annoying work of making gifts usable.', go: 'y2crash' }; } },
], },

y2crash: { art: 'storm', chart: true, kicker: 'Chapter five · Year two', title: () => 'The year the phones ring',
body: () => {
    const r = stepYear(); S._y2 = r;
    const pct = (r.ret * 100).toFixed(1);
    const cryptoLine = S.crypto ? `<p>Brad's fund is down <b>70%</b> and has suspended withdrawals${S.crypto >= 10 ? ' — roughly $1.4M of scholarship money is trapped inside' : ''}. Brad has not spoken in two meetings.</p>` : `<p>The Digital Assets Opportunity Fund you declined is down <b>70%</b> and gated. Nobody mentions it. Marjorie catches your eye for half a second. That's the entire reward for being right early — take it.</p>`;
    return `<p>It arrives the way it always does — fast, with a headline nobody predicted. Equities fall <b>32%</b> over the year; your bonds return +7% (this is why they exist). The portfolio returns <b>${pct}%</b>, and after the school's draw the endowment stands at <b>${fmtM(S.value)}</b>.</p>
    ${cryptoLine}
    ${S.building ? '<p>The building\'s two biggest tenants broke their leases; the roof estimate arrived anyway. You sell a stake at a discount to raise cash — <b>−$350k</b>.</p>' : ''}
    <div class="say"><span class="who">Marjorie · emergency session, 7:04 AM</span>"I have three board members demanding we go to cash, a CFO who needs $250,000 in six weeks, and a student newspaper asking if scholarships are safe. What do we do?"</div>`;
},
choices: [
    { t: 'Go to cash until the storm passes', s: 'Stop the bleeding. Protect what\'s left.', fx: () => { S.crashMove = 'cash'; S.trust += 8; S.lessons.push(['Crash behavior', 'Selling to cash "until things settle" locked in the crash loss and missed the +26% recovery year. The endowment paid ~$3M for one comfortable meeting. There is never a bell at the bottom.']); return { bad: true, text: 'The committee exhales — someone finally "did something." The comfort costs approximately everything: the endowment is now positioned to miss the recovery, which never sends an invitation. This is the exact trade the board fired a manager for in 2009. You\'ll see the bill next year.', go: 'students' }; } },
    { t: 'Hold, and rebalance INTO equities to targets', s: 'The IPS was written for precisely this morning.', fx: () => { S.crashMove = 'rebalance'; S.trust -= 6; S.lessons.push(['Crash behavior', 'Rebalancing into the crash — selling bonds to buy stocks at −32% — was the highest-value decision available: those shares drove the recovery. The rule made the decision; you just had to not override it.']); return { text: 'You walk the committee through the IPS paragraph they approved in calmer weather: bonds are UP 7% — you sell some of exactly those to buy equities at a third off, returning to target weights. Three trustees think you\'ve lost your mind, and trust dips <i>today</i>. The math will testify later.', go: 'students' }; } },
    { t: 'Hold the portfolio, but cut the spending draw', s: 'Protect the corpus; the school tightens its belt.', fx: () => { S.crashMove = 'cut'; S.paid -= 0.3; S.value += 0.3; S.trust -= 10; S.lessons.push(['Crash behavior', 'Cutting the draw protected the portfolio arithmetic and broke the human contract — scholarship students absorbed the market\'s volatility. Endowments exist to prevent exactly that transfer.']); return { bad: true, text: 'Financially tidy; institutionally explosive. The $300k cut hits mid-year scholarship funding — see next scene. There were portfolios built so this never becomes the choice; the time to make this decision was two years ago, at the allocation meeting.', go: 'students' }; } },
], },

students: { art: 'students', kicker: 'Chapter five · Outside the finance office', title: () => S.crashMove === 'cut' ? 'Forty students, one banner' : 'The quiet corridor',
body: () => {
    if (S.crashMove === 'cut') return `<p>Forty students stand outside the finance office. The banner is polite, which makes it worse: <b>"KEEP OUR SCHOLARSHIPS."</b> Two are seniors who may not register next term. The local paper runs the photo. Marjorie spends the week doing damage control and the board quietly reverses half your cut, funding it by selling equities — at the bottom, the exact trade you were trying to avoid, now made anyway with worse press.</p><p>Write this on the wall of every meeting room: <b>in an endowment, the humans are the senior tranche.</b> Build portfolios where their payment is never the variable.</p>`;
    if (S.crashMove === 'cash') return `<p>No protests — the draws are paid, from the enormous cash pile. The corridor is quiet. The damage you've taken doesn't photograph: it's the recovery you're about to miss, which will never appear on any banner because nobody protests an invisible loss. That's what makes this mistake the most popular one in institutional history.</p>`;
    return `<p>The draws go out on schedule — funded from the bond sleeve, exactly as designed, without selling a single depressed share of equity. No banners, no headlines, no emergency sales. The most important week of your tenure looks, from the outside, like absolutely nothing happened. Institutional investing at its best is the art of making crises boring.</p>`;
},
choices: [ { t: 'Survive to year three', s: '', fx: () => ({ text: 'Winter ends. It always has so far.', go: 'y3' }) } ], },

y3: { art: 'sunrise', chart: true, kicker: 'Chapter six · Year three', title: () => 'The recovery nobody believed',
body: () => {
    let extra = 0;
    if (S.crashMove === 'cash') { // parked in cash: miss equity rebound
        S.year++; const draw = spendAmount(); const ret = 0.015;
        S.value = S.value * (1 + ret) - draw; S.paid += draw;
        S.history.push({ x: 'Yr ' + S.year, v: +S.value.toFixed(2) });
        return `<p>Equities rebound <b>+26%</b> — one of the strongest years in decades. Whitfield's endowment, parked in cash "until things are clearer," earns <b>1.5%</b>. Milton Prep's endowment is up 19%. Brad has found his voice again, and this time he has a point.</p>
        <div class="say"><span class="who">Marjorie</span>"So when do we get back in?"</div>
        <p>And there it is — the second impossible decision that selling always schedules. Markets are up 26% off the low: re-entering now feels like buying high; waiting feels prudent and repeats the mistake. There is no good answer, which is the lesson: <b>the sell decision was actually two decisions, and nobody gets both right.</b></p>`;
    }
    if (S.crashMove === 'rebalance') extra = 0.035;   // rebalance bonus: bought low
    const r = stepYear(extra);
    return `<p>Equities rebound <b>+26%</b>${S.crashMove === 'rebalance' ? ', and the shares you bought at the bottom with rebalanced bond money return even more — the discipline dividend' : ''}. The portfolio returns <b>${(r.ret * 100).toFixed(1)}%</b>; the endowment stands at <b>${fmtM(S.value)}</b> after the draw.</p>
    <div class="say"><span class="who">Marjorie · at the annual meeting</span>"${S.crashMove === 'rebalance' ? 'A year ago I thought you were insane. I\'ve told the committee that our job in the next crash is to reread the policy statement and then sit on our hands.' : 'We made it through. Let\'s talk about what we\'d do differently.'}"</div>
    ${S.crashMove === 'rebalance' ? '<p><b>Trust surges.</b> Nothing builds institutional credibility like a rule that worked in the dark.</p>' : ''}`;
},
choices: [ { t: 'Fast-forward: years four through ten', s: 'Steady markets, steady draws, quarterly meetings.', fx: () => { if (S.crashMove === 'rebalance') S.trust += 18; return { text: 'Seven more years of ordinary markets — the compounding years, where the machine either works or leaks.', go: 'finale' }; } } ], },

finale: { chart: true, kicker: 'Chapter seven · Year ten', title: () => 'The ten-year report',
body: () => {
    while (S.year < 10) stepYear();
    const target = 20 * Math.pow(1.025, 10);  // real preservation @2.5% inflation
    S._target = target;
    return `<p>A decade after the handover, you present the ten-year report. The endowment stands at <b>${fmtM(S.value)}</b>, having paid the school a cumulative <b>${fmtM(S.paid)}</b>. To have preserved its <i>real</i> purchasing power against ~2.5% inflation, the corpus needed to reach about <b>${fmtM(target)}</b>.</p>
    <p>Marjorie, greyer now, reads the summary page twice, then looks up.</p>
    <div class="say"><span class="who">Marjorie</span>"My grandfather asked for one thing: be right, not brilliant. Let's see which you were."</div>`;
},
choices: [ { t: 'Open the scorecard', s: '', fx: () => ({ text: 'The committee turns to the last page.', go: 'score' }) } ], },

score: { kicker: 'The verdict', title: 'Your stewardship, graded',
body: () => {
    const target = S._target || 25.6;
    const realOK = S.value >= target; const nearOK = S.value >= target * 0.9;
    let pts = 0;
    pts += realOK ? 40 : nearOK ? 28 : S.value >= 20 ? 18 : 5;
    pts += Math.min(25, Math.max(0, (S.trust - 40) * 0.6));
    pts += S.crashMove === 'rebalance' ? 20 : S.crashMove === 'cut' ? 6 : 0;
    pts += S.crypto === 0 ? 8 : S.crypto === 2 ? 6 : 0;
    pts += S.spendRule !== 'fixed' ? 7 : 3;
    const grade = pts >= 85 ? 'A' : pts >= 70 ? 'B' : pts >= 55 ? 'C' : pts >= 40 ? 'D' : 'F';
    const gradeCol = pts >= 70 ? '#5CB88A' : pts >= 55 ? '#E0A24C' : '#D9645C';
    try { SL.saveQuizResult('experience-endowment', Math.round(pts), 100); } catch (e) {}
    try { localStorage.setItem('exp-endowment', grade); } catch (e) {}
    return `
    <div style="display:flex;align-items:center;gap:1.6rem;margin-bottom:0.4rem;">
        <span class="grade" style="color:${gradeCol}">${grade}</span>
        <div>
            <div style="font:700 0.66rem 'Inter',sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:#7d746a;">Fiduciary grade</div>
            <div style="font:600 1.1rem 'Fraunces',Georgia,serif;margin-top:0.2rem;">${grade === 'A' ? '"Right, not brilliant." He\'d have liked you.' : grade === 'B' ? 'A safe pair of hands — with one scar to learn from.' : grade === 'C' ? 'The school survived you. Study the lessons below.' : 'The endowment needed a rulebook. It got reactions.'}</div>
        </div>
    </div>
    <div class="score-grid">
        <div class="score-cell"><div class="k">Final corpus</div><div class="v" style="color:${realOK ? '#5CB88A' : '#E0A24C'}">${fmtM(S.value)}</div></div>
        <div class="score-cell"><div class="k">Real-value target</div><div class="v">${fmtM(target)}</div></div>
        <div class="score-cell"><div class="k">Paid to students & school</div><div class="v" style="color:#5CB88A">${fmtM(S.paid)}</div></div>
        <div class="score-cell"><div class="k">Final board trust</div><div class="v">${Math.round(Math.max(0, Math.min(100, S.trust)))}/100</div></div>
    </div>
    <div style="font:700 0.66rem 'Inter',sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:#E0A24C;margin:1.3rem 0 0.4rem;">What this decade taught</div>
    ${S.lessons.map(l => `<div class="lesson"><span class="dot">→</span><span><b>${l[0]}.</b> ${l[1]}</span></div>`).join('')}
    <div class="lesson"><span class="dot">→</span><span><b>The meta-lesson.</b> Every decision that mattered was made BEFORE the crisis: the spending rule, the allocation, the sleeve sizes, the IPS paragraph about rebalancing. The crisis only revealed which meetings you'd taken seriously.</span></div>
    <div style="display:flex;gap:0.7rem;margin-top:1.6rem;flex-wrap:wrap;">
        <button class="go-on" onclick="location.reload()">Run it again differently</button>
        <a class="go-on" style="background:rgba(255,255,255,0.07);color:#F4EEE6;text-decoration:none;display:inline-block;" href="hedgefund-experience.html">Next: The Analyst Desk →</a>
        <a class="go-on" style="background:none;border:1px solid rgba(236,226,214,0.25);color:#B7ADA1;text-decoration:none;display:inline-block;" href="experiences.html">All experiences</a>
    </div>`;
},
choices: [], },
};

render('intro');
</script>
</body>
</html>
