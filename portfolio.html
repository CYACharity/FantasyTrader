<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html{background-color:#0E0B09;}</style>
    <title>Portfolio — Fantasy Trader</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <meta name="theme-color" content="#0E0B09">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700;1,800;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/sl.js?v=3"></script>
    <script src="stock-data.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/stock-logo.js"></script>
    <script src="js/draft-universe.js"></script>
    <link rel="stylesheet" href="css/ft-bull.css?v=5">
    <script src="js/ft-bull.js?v=6"></script>
<style>
/* ============================================================
 *  PORTFOLIO — your rank, your roster, your milestones.
 *
 *  Same language as the main menu: words on a dark scene, no
 *  dashboard furniture. The hook is the rank: your total return
 *  since the $10,000 start puts you in a tier, and the bar shows
 *  how far it is to the next. The top tier is +50%, which is the
 *  practice-floor race. Everything on the screen is computed
 *  from your real account; nothing is filler. The chart, weekly
 *  report and purchase history live on Full stats.
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; background: #0E0B09; color: #F4EEE6; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.cnd { font-family: 'Barlow Condensed', 'Inter', sans-serif; font-style: italic; text-transform: uppercase; }
.pf-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 45% 60% at 22% 45%, color-mix(in srgb, var(--tier) 16%, transparent), transparent 70%),
                radial-gradient(ellipse 90% 80% at 50% 40%, #1A1511 0%, #0E0B09 72%); }
.pf { position: relative; z-index: 1; height: 100vh; padding: 3vh 3.4vw 2.4vh;
      display: grid; grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.4fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 2.2vh 3vw; }

/* top line */
.pf-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 1.4rem; }
.pf-back { font: 700 0.78rem 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,238,230,0.55); text-decoration: none; }
.pf-back:hover { color: #F4EEE6; }
.pf-title { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: clamp(2.8rem, 4.4vw, 3.8rem); text-transform: uppercase; line-height: 0.95; }
.pf-title::after { content: ''; display: block; width: 58%; height: 5px; margin-top: 4px; background: var(--tier); transform: skewX(-14deg); }
.pf-links { margin-left: auto; display: flex; gap: 0.8rem; }
.pf-links a { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.55rem 1.3rem; transform: skewX(-12deg);
    text-decoration: none; transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    background: rgba(244,238,230,0.06); border: 1.5px solid rgba(244,238,230,0.28); }
.pf-links a > span { display: inline-block; transform: skewX(12deg); font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900;
    font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.03em; color: #F4EEE6; }
.pf-links a:hover { background: rgba(244,238,230,0.12); transform: skewX(-12deg) translateY(-2px); }
.pf-links a.go { background: #5CB88A; border-color: #5CB88A; box-shadow: 0 4px 0 #2F6B4C; }
.pf-links a.go > span { color: #0E0B09; }
.pf-links a.go:hover { background: #6FCB9C; }
.pf-links a:active { transform: skewX(-12deg) translateY(2px); box-shadow: none; }
.pf-links svg { width: 18px; height: 18px; transform: skewX(12deg); }

/* the rank */
.pf-rank { align-self: center; }
.pf-emblem { width: clamp(150px, 19vh, 190px); height: auto; display: block; margin-bottom: 1.2vh; filter: drop-shadow(0 12px 30px color-mix(in srgb, var(--tier) 35%, transparent)); }
.pf-tier { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: clamp(3rem, 6.4vh, 4.2rem); text-transform: uppercase; line-height: 0.95; color: var(--tier); }
.pf-ret { margin-top: 0.3rem; font: 700 0.95rem 'Inter', sans-serif; color: rgba(244,238,230,0.7); }
.pf-ret b { font-variant-numeric: tabular-nums; }
.pf-ret b.up { color: #7BD3A6; } .pf-ret b.down { color: #E8867F; }
.pf-bar { position: relative; height: 12px; margin: 1.4vh 0 0.5rem; background: rgba(244,238,230,0.08); transform: skewX(-14deg); overflow: hidden; max-width: 420px; }
.pf-bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--tier); transition: width 1s cubic-bezier(0.2, 0.9, 0.25, 1); }
.pf-next { font: 700 0.78rem 'Inter', sans-serif; letter-spacing: 0.04em; color: rgba(244,238,230,0.6); }
.pf-next b { color: #F4EEE6; }
.pf-money { display: flex; gap: 2.2rem; margin-top: 3vh; }
.pf-money div { font: 700 0.68rem 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,238,230,0.5); }
.pf-money b { display: block; margin-top: 3px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 2rem; letter-spacing: 0; text-transform: none; color: #F4EEE6; font-variant-numeric: tabular-nums; line-height: 1; }
.pf-money b.up { color: #7BD3A6; } .pf-money b.down { color: #E8867F; }

/* Rally's one line about your roster */
.pf-rally { display: flex; align-items: center; gap: 0.7rem; margin-top: 3vh; max-width: 440px; }
.pf-rally .rig { width: 64px; height: 64px; flex-shrink: 0; }
.pf-rally .rig .bull-rig { width: 64px; height: 64px; }
.pf-rally p { position: relative; margin: 0; padding: 0.6rem 0.85rem; background: rgba(244,238,230,0.06); border: 1px solid rgba(244,238,230,0.10);
    font: 600 0.82rem/1.4 'Inter', sans-serif; color: rgba(244,238,230,0.85); }
.pf-rally p::before { content: ''; position: absolute; left: -7px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 0; border-right-color: rgba(244,238,230,0.10); }
.pf-rally p b { color: #F0B865; }

/* the roster */
.pf-roster { min-height: 0; display: flex; flex-direction: column; }
.pf-rhead { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1.2vh; }
.pf-rhead h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 1.9rem; text-transform: uppercase; }
.pf-rhead span { font: 700 0.75rem 'Inter', sans-serif; color: rgba(244,238,230,0.5); letter-spacing: 0.1em; text-transform: uppercase; }
.pf-cards { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; align-content: start; padding: 4px 6px 4px 2px; }
.pf-cards::-webkit-scrollbar { width: 6px; } .pf-cards::-webkit-scrollbar-thumb { background: rgba(244,238,230,0.14); }
.pf-card { position: relative; display: block; text-decoration: none; color: inherit; padding: 14px 16px 12px;
    background: linear-gradient(160deg, rgba(38,32,27,0.92), rgba(24,20,17,0.92));
    border: 1px solid rgba(244,238,230,0.10); border-left: 4px solid var(--c, #5CB88A);
    transition: transform 0.16s cubic-bezier(0.2,0.9,0.3,1.2), border-color 0.16s ease; }
.pf-card:hover { transform: translateY(-4px); border-color: rgba(244,238,230,0.24); border-left-color: var(--c, #5CB88A); }
.pf-card.up { --c: #5CB88A; } .pf-card.down { --c: #D9645C; } .pf-card.flat { --c: #9A8F84; }
.pc-top { display: flex; align-items: center; gap: 10px; }
.pc-top .logo-tile { width: 34px !important; height: 34px !important; flex-shrink: 0; }
.pc-sym { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 1.5rem; line-height: 1; }
.pc-name { font: 600 0.7rem 'Inter', sans-serif; color: rgba(244,238,230,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.pc-day { margin-left: auto; font: 800 0.72rem 'Inter', sans-serif; padding: 2px 7px; transform: skewX(-10deg); }
.pf-card.up .pc-day { background: rgba(92,184,138,0.16); color: #7BD3A6; }
.pf-card.down .pc-day { background: rgba(217,100,92,0.16); color: #E8867F; }
.pf-card.flat .pc-day { background: rgba(244,238,230,0.07); color: rgba(244,238,230,0.6); }
.pc-val { margin-top: 10px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pc-sub { display: flex; justify-content: space-between; margin-top: 4px; font: 600 0.72rem 'Inter', sans-serif; color: rgba(244,238,230,0.55); font-variant-numeric: tabular-nums; }
.pc-sub .up { color: #7BD3A6; } .pc-sub .down { color: #E8867F; }
.pc-share { margin-top: 9px; height: 4px; background: rgba(244,238,230,0.08); }
.pc-share i { display: block; height: 100%; background: var(--c); }
.pf-empty { grid-column: 1 / -1; padding: 1rem 0 0; }
.pf-empty p { margin: 0 0 1rem; font: 600 0.9rem 'Inter', sans-serif; color: rgba(244,238,230,0.6); }
.pf-starters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pf-starters .pf-card { --c: #E0A24C; }
.pf-starters .pc-val { font-size: 1.1rem; color: #F0B865; }

/* sector mix */
.pf-mix { flex: 0 0 auto; margin-top: 1.6vh; }
.pf-mix .k { display: flex; justify-content: space-between; font: 700 0.68rem 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,238,230,0.5); margin-bottom: 7px; }
.pf-mix .k b { color: #F0B865; letter-spacing: 0.02em; text-transform: none; font-weight: 700; }
.pf-strip { display: flex; height: 14px; gap: 2px; transform: skewX(-14deg); }
.pf-strip i { display: block; height: 100%; min-width: 4px; transition: flex-grow 0.6s ease; }
.pf-keys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font: 600 0.72rem 'Inter', sans-serif; color: rgba(244,238,230,0.65); }
.pf-keys span::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--k); transform: skewX(-14deg); }

/* milestones */
.pf-miles { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.pf-miles .k { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; margin-right: 0.4rem; }
.pf-mile { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.4rem 0.75rem; transform: skewX(-12deg);
    background: rgba(244,238,230,0.05); border: 1px solid rgba(244,238,230,0.10); }
.pf-mile > * { transform: skewX(12deg); }
.pf-mile i { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid rgba(244,238,230,0.3); font-style: normal; }
.pf-mile span { font: 700 0.74rem 'Inter', sans-serif; color: rgba(244,238,230,0.55); }
.pf-mile.done { background: rgba(92,184,138,0.14); border-color: rgba(92,184,138,0.45); }
.pf-mile.done i { background: #5CB88A; border-color: #5CB88A; }
.pf-mile.done i::after { content: ''; width: 6px; height: 3px; border: 2px solid #0C1A13; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.pf-mile.done span { color: #F4EEE6; }
.pf-legal { margin-left: auto; font: 500 0.64rem 'Inter', sans-serif; color: rgba(244,238,230,0.3); white-space: nowrap; }

.pf-rank, .pf-roster, .pf-miles { animation: pfIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
.pf-roster { animation-delay: 0.08s; } .pf-miles { animation-delay: 0.16s; }
@keyframes pfIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pf-rank, .pf-roster, .pf-miles { animation: none; } .pf-bar i { transition: none; } }
@media (max-width: 900px) {
    body { overflow: auto; }
    .pf { height: auto; grid-template-columns: 1fr; }
    .pf-cards { overflow: visible; }
    .pf-starters { grid-template-columns: 1fr; }
    .pf-legal { margin-left: 0; white-space: normal; }
}
</style>

</head>
<body style="--tier:#C98A5B">
<div class="pf-scene" aria-hidden="true"></div>

<main class="pf">
    <div class="pf-top">
        <a class="pf-back" href="dashboard.html" data-back>&larr; Menu</a>
        <h1 class="pf-title">Portfolio</h1>
        <nav class="pf-links">
            <a href="portfolio-stats.html"><svg viewBox="0 0 24 24" fill="none" stroke="#F0B865" stroke-width="2.6" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Full stats</span></a>
            <a class="go" href="trading.html"><span>Trade &rarr;</span></a>
        </nav>
    </div>

    <section class="pf-rank" aria-label="Your rank">
        <svg class="pf-emblem" id="emblem" viewBox="0 0 120 132" aria-hidden="true"></svg>
        <div class="pf-tier" id="tierName">Bronze</div>
        <div class="pf-ret">Total return <b id="retPct">+0.00%</b></div>
        <div class="pf-bar"><i id="tierBar"></i></div>
        <div class="pf-next" id="tierNext"></div>
        <div class="pf-money">
            <div>Value<b id="mValue">$10,000</b></div>
            <div>Cash<b id="mCash">$10,000</b></div>
            <div>Today<b id="mDay">+0.00%</b></div>
        </div>
        <div class="pf-rally"><span class="rig" id="rallyRig"></span><p id="rallyTip">Pulling up your roster&hellip;</p></div>
    </section>

    <section class="pf-roster" aria-label="Your holdings">
        <div class="pf-rhead"><h2>Roster</h2><span id="rCount">Loading</span></div>
        <div class="pf-cards" id="cards"></div>
        <div class="pf-mix" id="mix" hidden>
            <div class="k"><span>Sector mix</span><b id="mixTip"></b></div>
            <div class="pf-strip" id="strip"></div>
            <div class="pf-keys" id="keys"></div>
        </div>
    </section>

    <footer class="pf-miles" id="miles" aria-label="Milestones">
        <span class="k">Milestones</span>
    </footer>
</main>

<script>
(function () {
    'use strict';
    const START = 10000;
    const $ = id => document.getElementById(id);
    const money = n => '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const pct = n => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%';
    const U = {}; (window.__U || []).forEach(u => { U[u.s] = u; });

    /* the ladder: total return since the start, in percent */
    const TIERS = [
        { name: 'Bronze',   at: -Infinity, c: '#C98A5B' },
        { name: 'Silver',   at: 2,  c: '#B9C4CE' },
        { name: 'Gold',     at: 5,  c: '#F0C674' },
        { name: 'Platinum', at: 15, c: '#7FD1C7' },
        { name: 'Diamond',  at: 30, c: '#9DB8FF' },
        { name: 'Legend',   at: 50, c: '#F0907E' },
    ];
    function emblem(tier, i) {
        const c = tier.c, pips = Array.from({ length: i + 1 }, (_, k) =>
            '<rect x="' + (60 - (i + 1) * 7 + k * 14 + 2) + '" y="104" width="10" height="4" fill="' + c + '"/>').join('');
        return '<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + c + '"/><stop offset="1" stop-color="' + c + '" stop-opacity="0.35"/></linearGradient></defs>' +
            '<path d="M60 4 L110 22 L110 66 C110 98 86 118 60 128 C34 118 10 98 10 66 L10 22 Z" fill="#17120F" stroke="url(#eg)" stroke-width="4"/>' +
            '<path d="M60 16 L99 30 L99 66 C99 91 81 107 60 116 C39 107 21 91 21 66 L21 30 Z" fill="' + c + '" fill-opacity="0.12" stroke="' + c + '" stroke-opacity="0.45" stroke-width="1.5"/>' +
            '<path d="M36 78 L50 64 L60 72 L82 46" fill="none" stroke="' + c + '" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<path d="M70 44 L84 44 L84 58" fill="none" stroke="' + c + '" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>' + pips;
    }

    function paintRank(ret) {
        let i = 0; TIERS.forEach((t, k) => { if (ret >= t.at) i = k; });
        const t = TIERS[i], next = TIERS[i + 1];
        document.body.style.setProperty('--tier', t.c);
        $('emblem').innerHTML = emblem(t, i);
        $('tierName').textContent = t.name;
        const r = $('retPct'); r.textContent = pct(ret); r.className = ret > 0.005 ? 'up' : ret < -0.005 ? 'down' : '';
        let fill = 1, line = 'Top tier. You won the race.';
        if (next) {
            const lo = Math.max(i === 0 ? 0 : t.at, 0), span = next.at - lo;
            fill = ret <= lo ? 0 : Math.min(1, (ret - lo) / span);
            line = ret < 0 ? 'Get back above <b>0%</b>, then <b>+' + next.at + '%</b> for ' + next.name
                           : '<b>' + (next.at - ret).toFixed(2) + ' points</b> to ' + next.name + ' (+' + next.at + '%)';
        }
        $('tierNext').innerHTML = line;
        setTimeout(() => { $('tierBar').style.width = (fill * 100).toFixed(1) + '%'; }, 200);
    }

    function paintMiles(held, sectors, ret) {
        const M = [
            ['First trade', held >= 1], ['3 sectors', sectors >= 3], ['5 positions', held >= 5],
            ['In the green', ret > 0], ['+10%', ret >= 10], ['The +50% race', ret >= 50],
        ];
        const box = $('miles');
        box.querySelectorAll('.pf-mile, .pf-legal').forEach(e => e.remove());
        M.forEach(([label, done]) => {
            const m = document.createElement('span');
            m.className = 'pf-mile' + (done ? ' done' : '');
            m.innerHTML = '<i></i><span></span>';
            m.querySelector('span').textContent = label;
            box.appendChild(m);
        });
        const l = document.createElement('span'); l.className = 'pf-legal';
        l.textContent = 'A simulation for education and entertainment. Not investment advice. No real money.';
        box.appendChild(l);
    }

    const SECTOR_C = ['#5CB88A', '#F0B865', '#9DB8FF', '#E8867F', '#7FD1C7', '#C9A0E8', '#D9B48A', '#9A8F84'];
    function paintMix(rows, invested) {
        const box = $('mix');
        if (!rows.length || invested <= 0) { box.hidden = true; return; }
        const by = {}; rows.forEach(r => { by[r.sector] = (by[r.sector] || 0) + r.value; });
        const list = Object.entries(by).sort((a, b) => b[1] - a[1]);
        $('strip').innerHTML = list.map(([, v], i) => '<i style="flex-grow:' + v.toFixed(0) + ';background:' + SECTOR_C[i % 8] + '"></i>').join('');
        const keys = $('keys'); keys.innerHTML = '';
        list.forEach(([name, v], i) => {
            const k = document.createElement('span'); k.style.setProperty('--k', SECTOR_C[i % 8]);
            k.textContent = name + ' ' + Math.round(v / invested * 100) + '%'; keys.appendChild(k);
        });
        const top = list[0][1] / invested;
        $('mixTip').textContent = list.length < 3 ? 'Add a third sector to unlock a milestone'
            : top > 0.5 ? list[0][0] + ' is over half your holdings' : 'Nicely spread';
        box.hidden = false;
    }

    function paintTip(rows, invested, cash, total) {
        const el = $('rallyTip'); if (!el) return;
        const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        let tip;
        if (!rows.length) tip = 'Empty roster. Pick one company you actually understand and start there.';
        else {
            const live = rows.filter(r => r.live);
            const mover = live.slice().sort((a, b) => Math.abs(b.day) - Math.abs(a.day))[0];
            const by = {}; rows.forEach(r => { by[r.sector] = (by[r.sector] || 0) + r.value; });
            const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
            if (mover && Math.abs(mover.day) >= 2) tip = '<b>' + esc(mover.sym) + '</b> is your big mover today at ' + pct(mover.day) + '. Tap it to see why.';
            else if (top && invested > 0 && top[1] / invested > 0.6) tip = '<b>' + Math.round(top[1] / invested * 100) + '%</b> of your holdings is ' + esc(top[0]) + '. One bad day there hits everything.';
            else if (total > 0 && cash / total > 0.5) tip = 'Over half your account is sitting in cash. Cash can\'t climb the ranks.';
            else if (rows.length < 3) tip = 'Only ' + rows.length + ' on the roster. A third pick spreads the risk.';
            else tip = 'Quiet day. Your best since buying is <b>' + esc(rows.slice().sort((a, b) => b.gain - a.gain)[0].sym) + '</b>.';
        }
        el.innerHTML = tip;
    }

    function card(h, total) {
        const a = document.createElement('a');
        a.className = 'pf-card ' + (h.day > 0.005 ? 'up' : h.day < -0.005 ? 'down' : 'flat');
        a.href = 'trading.html?symbol=' + encodeURIComponent(h.sym);
        const share = total > 0 ? h.value / total * 100 : 0;
        a.innerHTML =
            '<div class="pc-top">' + (window.logoHtml ? logoHtml(h.sym, h.sector) : '') +
                '<div><div class="pc-sym"></div><div class="pc-name"></div></div>' +
                '<span class="pc-day">' + (h.live ? pct(h.day) : 'closed') + '</span></div>' +
            '<div class="pc-val">' + money(h.value) + '</div>' +
            '<div class="pc-sub"><span>' + h.shares + ' sh</span><span class="' + (h.gain >= 0 ? 'up' : 'down') + '">' + pct(h.gain) + ' since buy</span></div>' +
            '<div class="pc-share" title="' + share.toFixed(1) + '% of your holdings"><i style="width:' + share.toFixed(1) + '%"></i></div>';
        a.querySelector('.pc-sym').textContent = h.sym;
        a.querySelector('.pc-name').textContent = (U[h.sym] && U[h.sym].n) || h.sector || '';
        return a;
    }

    function starters() {
        const box = document.createElement('div'); box.className = 'pf-empty';
        box.innerHTML = '<p>Empty roster. Start with one of these:</p><div class="pf-starters"></div>';
        const grid = box.querySelector('.pf-starters');
        ['NVDA', 'GOOGL', 'MSFT'].forEach(sym => {
            const a = document.createElement('a'); a.className = 'pf-card'; a.href = 'trading.html?symbol=' + sym;
            a.innerHTML = '<div class="pc-top">' + (window.logoHtml ? logoHtml(sym, 'Technology') : '') +
                '<div><div class="pc-sym">' + sym + '</div><div class="pc-name"></div></div></div><div class="pc-val">Research &rarr;</div>';
            a.querySelector('.pc-name').textContent = (U[sym] && U[sym].n) || '';
            grid.appendChild(a);
        });
        return box;
    }

    async function load() {
        let pf = { cash: START, stocks: {} };
        try { pf = await SL.loadPortfolio(); } catch (e) {}
        const syms = Object.keys(pf.stocks || {}).filter(s => pf.stocks[s] && pf.stocks[s].shares > 0);
        let q = {};
        try { q = syms.length ? await stockDataService.getQuotes(syms) : {}; } catch (e) {}
        const rows = syms.map(sym => {
            const pos = pf.stocks[sym], live = q[sym];
            const isLive = !!(live && live.isLive && live.price != null);
            const px = isLive ? Number(live.price) : Number(pos.avgPrice || 0);
            const day = isLive ? Number(live.change_pct != null ? live.change_pct : live.changePercent || 0) : 0;
            const cost = Number(pos.avgPrice || px);
            return { sym, shares: +Number(pos.shares).toFixed(4), value: px * pos.shares, day, live: isLive,
                     gain: cost > 0 ? (px - cost) / cost * 100 : 0,
                     sector: (U[sym] && U[sym].se) || 'Other', prevValue: isLive && day > -100 ? px * pos.shares / (1 + day / 100) : px * pos.shares };
        }).sort((a, b) => b.value - a.value);

        const invested = rows.reduce((s, r) => s + r.value, 0);
        const cash = Number(pf.cash) || 0, total = cash + invested;
        const ret = (total - START) / START * 100;
        const prevTotal = cash + rows.reduce((s, r) => s + r.prevValue, 0);
        const dayPct = prevTotal > 0 ? (total - prevTotal) / prevTotal * 100 : 0;

        $('mValue').textContent = money(total);
        $('mCash').textContent = money(cash);
        const d = $('mDay'); d.textContent = pct(dayPct); d.className = dayPct > 0.005 ? 'up' : dayPct < -0.005 ? 'down' : '';
        paintRank(ret);

        const cards = $('cards'); cards.innerHTML = '';
        if (rows.length) rows.forEach(r => cards.appendChild(card(r, invested)));
        else cards.appendChild(starters());
        $('rCount').textContent = rows.length ? rows.length + (rows.length === 1 ? ' player' : ' players') : 'Empty';
        paintMix(rows, invested);
        paintTip(rows, invested, cash, total);
        paintMiles(rows.length, new Set(rows.map(r => r.sector)).size, ret);
    }

    paintRank(0); paintMiles(0, 0, 0);
    if (window.FTBull) { $('rallyRig').innerHTML = FTBull.rigSVG(); }
    let tries = 0;
    (function wait() {
        if (window.SL && typeof stockDataService !== 'undefined') return load();
        if (++tries < 40) setTimeout(wait, 150); else load();
    })();
    addEventListener('focus', () => load());
})();
</script>
<script src="js/ft-tour.js?v=3"></script>
</body>
</html>
