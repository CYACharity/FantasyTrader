    <style>html{background-color:#14100E;}
/* ============================================================
 *  THE BACKGROUND — still.
 *
 *  It used to be a line scrolling across a canvas: first too busy,
 *  then shaky, then just not good. It is now the thing people liked
 *  on the practice floor — one glowing green line — drawn in once
 *  when the page opens and then left alone, over a faint dot grid.
 *  Nothing moves after the first two seconds.
 * ============================================================ */
.lg-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
        radial-gradient(ellipse 60% 50% at 12% 0%, rgba(92,184,138,0.10), transparent 70%),
        radial-gradient(ellipse 55% 45% at 100% 100%, rgba(224,162,76,0.07), transparent 70%);
}
.lg-bg::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(236,226,214,0.10) 1px, transparent 1.2px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, #000 20%, transparent 85%);
            mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, #000 20%, transparent 85%);
}
.lg-bg svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 100%);
}
.lg-bg-fill { fill: url(#lgFill); opacity: 0; animation: lgFade 1.4s ease 1.6s forwards; }
.lg-bg-line, .lg-bg-glow {
    fill: none; stroke-linecap: round; stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: lgDraw 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
}
.lg-bg-line { stroke: #5CB88A; stroke-width: 2.4; filter: drop-shadow(0 0 5px rgba(92,184,138,0.6)); }
.lg-bg-glow { stroke: rgba(92,184,138,0.16); stroke-width: 14; filter: blur(6px); }
@keyframes lgDraw { to { stroke-dashoffset: 0; } }
@keyframes lgFade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
    .lg-bg-line, .lg-bg-glow { animation: none; stroke-dashoffset: 0; }
    .lg-bg-fill { animation: none; opacity: 1; }
}
:where(.lg-bg ~ *) { position: relative; z-index: 1; }

/* ============================================================
 *  THE TWO DOORS — slim rows, not slabs.
 *
 *  Each is one line of intent: an icon, what it is, what it does,
 *  and an arrow. The chunky edge, the uppercase kicker and the
 *  full-width coloured button are gone; colour lives in the icon
 *  and comes up on hover.
 * ============================================================ */
.lg-choice {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;
    margin-top: 1.4rem;
}
.lg-card {
    position: relative; top: 0;
    display: grid !important; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 0.95rem;
    padding: 1rem 1.05rem !important;
    border-radius: 16px; text-align: left; cursor: pointer;
    background: rgba(34, 29, 25, 0.82);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(236,226,214,0.10) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25) !important;
    font-family: var(--lx-sans);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    overflow: hidden;
}
.lg-card::before { display: none; }
.lg-card:hover {
    transform: translateY(-2px);
    border-color: var(--c-line-hi) !important;
    background: rgba(40, 34, 29, 0.9);
}
.lg-card:active { top: 0; transform: translateY(0) scale(0.99); }
.lg-card:focus-visible { outline: 2px solid var(--c-line-hi); outline-offset: 3px; }

.lg-ico {
    width: 46px; height: 46px; border-radius: 13px; margin: 0 !important;
    display: grid; place-items: center;
    background: var(--i-fill); border: 1px solid var(--i-line); box-shadow: none !important;
    transition: transform 0.2s cubic-bezier(0.2,0.9,0.3,1.3);
}
.lg-ico svg { width: 26px; height: 26px; }
.lg-create { --c-line-hi: var(--lx-sage); }
.lg-join   { --c-line-hi: var(--lx-honey); }
.lg-create .lg-ico { --i-fill: rgba(92,184,138,0.14); --i-line: rgba(92,184,138,0.38); }
.lg-join   .lg-ico { --i-fill: rgba(224,162,76,0.14); --i-line: rgba(224,162,76,0.38); }
.lg-card:hover .lg-ico { transform: rotate(-6deg) scale(1.05); }

.lg-txt { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.lg-title {
    font: 800 1.02rem 'Inter', system-ui, sans-serif; letter-spacing: -0.015em;
    color: var(--lx-ink); margin: 0 !important;
}
.lg-desc { font: 500 0.8rem 'Inter', system-ui, sans-serif; color: var(--lx-ink-3); }

.lg-go {
    width: 34px; height: 34px; padding: 0 !important; margin: 0 !important;
    border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,0.05) !important; color: var(--lx-ink-2) !important;
    border: 1px solid rgba(236,226,214,0.10);
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}
.lg-go svg { width: 15px; height: 15px; transition: transform 0.18s ease; }
.lg-card:hover .lg-go { background: var(--c-line-hi) !important; border-color: transparent; color: #14100E !important; }
.lg-card:hover .lg-go svg { transform: translateX(2px); }
@media (max-width: 640px) { .lg-choice { grid-template-columns: 1fr; } }
</style>

<style>
/* ============================================================
 *  LEAGUES
 *
 *  Rebuilt on the Academy's design system. What went:
 *
 *   · the clipboard. It was a drawn desk object — a metal clip, a
 *     paper sheet, a board running off the bottom of the page —
 *     wrapped around a list of four rows. All of that furniture
 *     to frame content that fits in a card.
 *   · Fraunces. Headings are the same display face as the rest of
 *     the app now, so "Compete" stopped looking like a different
 *     product's title.
 *   · eleven separate blocks restyling .league-card and .active-
 *     leagues, several of them with !important, several of them
 *     contradicting each other. One definition each now.
 *   · the floating ticker generator: already display:none, still
 *     spawning DOM nodes on a setInterval that never cleared.
 * ============================================================ */

.lg-wrap { max-width: 820px; margin: 0 auto; padding: 0 1.1rem 4rem; }

/* ── header ─────────────────────────────────────────────────── */
.lg-head {
    position: sticky; top: 0; z-index: 40;
    background: rgba(20, 16, 14, 0.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--lx-line);
    padding: 0.8rem 1.1rem;
}
.lg-head-in {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: center; gap: 0.8rem;
}
.lg-back {
    display: inline-flex; align-items: center;
    color: var(--lx-ink-3); text-decoration: none;
    font: 700 1rem var(--lx-sans);
    padding: 0.2rem 0.3rem; border-radius: 8px;
    transition: color 0.15s ease;
}
.lg-back:hover { color: var(--lx-ink); }
.lg-wordmark {
    font: 800 0.95rem 'Inter', system-ui, sans-serif; letter-spacing: -0.01em;
    color: var(--lx-ink-2);
}
.lg-rules {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.42rem 0.8rem; border-radius: 999px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--lx-line);
    color: var(--lx-ink-2); text-decoration: none;
    font: 700 0.72rem 'Inter', system-ui, sans-serif; letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s ease;
}
.lg-rules:hover { color: var(--lx-ink); border-color: var(--lx-line-2); }
.lg-rules svg { width: 14px; height: 14px; }

/* ── hero ───────────────────────────────────────────────────── */
.lg-hero { padding: 2rem 0 0.2rem; }
.lg-kicker {
    font: 800 0.68rem 'Inter', system-ui, sans-serif; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--lx-sage); margin: 0 0 0.5rem;
}
.lg-hero h1 {
    margin: 0; font: 800 clamp(2rem, 5vw, 2.7rem)/1.04 'Inter', system-ui, sans-serif;
    letter-spacing: -0.035em;
    background: linear-gradient(135deg, #ffffff 22%, var(--lx-sage) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* ── your leagues ───────────────────────────────────────────── */
.lg-section {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin: 2.2rem 0 0.85rem;
}
.lg-section h2 {
    margin: 0; font: 800 1.15rem 'Inter', system-ui, sans-serif;
    letter-spacing: -0.02em; color: var(--lx-ink);
}
.lg-section .count {
    font: 700 0.68rem var(--lx-sans); letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--lx-ink-3);
}

.lg-list { display: flex; flex-direction: column; gap: 0.6rem; }

.lg-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 1rem;
    padding: 0.95rem 1.05rem;
    border-radius: 16px;
    background: var(--lx-surface);
    border: 2px solid var(--lx-line);
    border-bottom-width: 4px;
    transition: border-color 0.16s ease, background 0.16s ease;
}
.lg-row:hover { border-color: var(--lx-line-2); }

.lg-avatar {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
    display: grid; place-items: center;
    background: rgba(92,184,138,0.12);
    border: 1px solid rgba(92,184,138,0.26);
}
.lg-avatar img { width: 26px; height: 26px; object-fit: contain; }
.lg-avatar svg { width: 24px; height: 24px; }

.lg-name {
    font: 800 1rem 'Inter', system-ui, sans-serif; color: var(--lx-ink);
    letter-spacing: -0.015em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lg-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
    margin-top: 0.25rem;
    font: 600 0.75rem var(--lx-sans); color: var(--lx-ink-3);
}
/* dot separators drawn rather than typed, so a missing charset could
   never turn them into three bytes of noise again */
.lg-meta span + span::before {
    content: ''; display: inline-block;
    width: 3px; height: 3px; border-radius: 50%;
    background: currentColor; opacity: 0.6;
    margin-right: 0.5rem; vertical-align: 0.18em;
}
.lg-code {
    font: 700 0.7rem ui-monospace, 'JetBrains Mono', Menlo, monospace;
    letter-spacing: 0.09em; color: var(--lx-honey);
}

.lg-right { display: flex; align-items: center; gap: 0.7rem; flex-shrink: 0; }
.lg-status {
    padding: 0.3rem 0.62rem; border-radius: 999px;
    font: 800 0.6rem 'Inter', system-ui, sans-serif; letter-spacing: 0.09em;
    text-transform: uppercase; white-space: nowrap;
    border: 1px solid currentColor;
}
.lg-status.lobby, .lg-status.pending { color: var(--lx-honey); }
.lg-status.drafting                  { color: var(--lx-blue); }
.lg-status.active                    { color: var(--lx-sage); }
.lg-status.complete,
.lg-status.completed                 { color: var(--lx-ink-3); }

.lg-open {
    position: relative; top: 0;
    padding: 0.62rem 1.05rem; border-radius: 12px;
    border: none; cursor: pointer;
    background: var(--lx-sage); color: #0C1A13;
    font: 800 0.76rem 'Inter', system-ui, sans-serif;
    letter-spacing: 0.06em; text-transform: uppercase;
    box-shadow: 0 4px 0 var(--lx-sage-dk);
    transition: filter 0.15s ease, transform 0.07s ease, box-shadow 0.07s ease;
}
.lg-open:hover  { filter: brightness(1.07); }
.lg-open:active { top: 4px; box-shadow: 0 0 0 var(--lx-sage-dk); }

/* ── empty state ────────────────────────────────────────────────
   No dashed box. A dashed border says "drop something here", which
   is not what this is. */
.lg-empty {
    text-align: center; padding: 2.6rem 1.4rem;
    border-radius: 18px;
    background: var(--lx-surface);
    border: 2px solid var(--lx-line);
}
.lg-empty-art { display: grid; place-items: center; margin-bottom: 0.9rem; opacity: 0.85; }
.lg-empty-art svg { width: 66px; height: 66px; }
.lg-empty h3 {
    margin: 0 0 0.35rem; font: 800 1.1rem 'Inter', system-ui, sans-serif; color: var(--lx-ink);
}
.lg-empty p {
    margin: 0; color: var(--lx-ink-2);
    font: 500 0.88rem/1.6 var(--lx-sans);
    max-width: 25rem; margin-inline: auto;
}
.lg-skeleton {
    height: 74px; border-radius: 16px;
    background: linear-gradient(100deg,
        var(--lx-surface) 30%, var(--lx-surface-2) 50%, var(--lx-surface) 70%);
    background-size: 260% 100%;
    animation: lgShimmer 1.3s ease-in-out infinite;
}
@keyframes lgShimmer {
    from { background-position: 130% 0; }
    to   { background-position: -30% 0; }
}

.lg-legal {
    text-align: center; color: var(--lx-ink-3);
    font-size: 0.7rem; line-height: 1.65;
    max-width: 32rem; margin: 2.2rem auto 0;
}

/* ── join sheet ─────────────────────────────────────────────── */
.lg-code-input {
    width: 100%; margin: 0.2rem 0 0.35rem;
    padding: 0.9rem 1rem; border-radius: 14px;
    background: var(--lx-bg-2);
    border: 2px solid var(--lx-line);
    color: var(--lx-ink);
    font: 800 1.2rem ui-monospace, 'JetBrains Mono', Menlo, monospace;
    letter-spacing: 0.22em; text-align: center; text-transform: uppercase;
    outline: none; transition: border-color 0.16s ease;
}
.lg-code-input::placeholder { color: var(--lx-ink-3); letter-spacing: 0.16em; }
.lg-code-input:focus { border-color: var(--lx-honey); }
.lg-sheet-err {
    color: var(--lx-red); font: 600 0.8rem var(--lx-sans);
    min-height: 1.2rem; margin-bottom: 0.6rem;
}

/* ── responsive ─────────────────────────────────────────────── */
@media (max-width: 700px) {
    .lg-choice { grid-template-columns: 1fr; }
    .lg-hero { padding-top: 1.4rem; }
    /* the row collapses to two lines: identity on top, actions under */
    .lg-row { grid-template-columns: auto minmax(0, 1fr); row-gap: 0.75rem; }
    .lg-right { grid-column: 1 / -1; justify-content: space-between; }
    .lg-open { flex: 1; max-width: 9rem; }
}

/* ── tutorial overlay ───────────────────────────────────────── */
.tut-backdrop {
    position: fixed; inset: 0; z-index: 90;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.tut-backdrop.active { opacity: 1; pointer-events: auto; }
.tut-overlay-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tut-highlight-border {
    position: absolute; border: 2px solid var(--lx-sage);
    border-radius: 18px; pointer-events: none;
    box-shadow: 0 0 0 4px rgba(92,184,138,0.18);
    transition: all 0.32s cubic-bezier(0.2,0.8,0.3,1);
}
.tut-tooltip {
    position: absolute; width: 300px;
    background: var(--lx-surface); border: 2px solid var(--lx-line-2);
    border-radius: 16px; padding: 1rem 1.1rem;
    box-shadow: 0 18px 46px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(8px); transition: all 0.28s ease;
}
.tut-tooltip.visible { opacity: 1; transform: none; }
.tut-tooltip-step {
    font: 800 0.58rem 'Inter', system-ui, sans-serif; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--lx-sage); margin-bottom: 0.35rem;
}
.tut-tooltip-title { font: 800 1.02rem 'Inter', system-ui, sans-serif; margin-bottom: 0.35rem; }
.tut-tooltip-desc  { font-size: 0.84rem; line-height: 1.55; color: var(--lx-ink-2); }
.tut-tooltip-progress { display: flex; gap: 4px; margin: 0.9rem 0; }
.tut-tooltip-pip { flex: 1; height: 4px; border-radius: 999px; background: rgba(236,226,214,0.12); }
.tut-tooltip-pip.done   { background: var(--lx-sage-dk); }
.tut-tooltip-pip.active { background: var(--lx-sage); }
.tut-tooltip-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
.tut-secondary-btn, .tut-next-btn {
    padding: 0.55rem 0.95rem; border-radius: 11px; cursor: pointer;
    font: 800 0.74rem 'Inter', system-ui, sans-serif; letter-spacing: 0.05em;
    text-transform: uppercase; border: none;
}
.tut-secondary-btn { background: none; color: var(--lx-ink-3); }
.tut-secondary-btn:hover { color: var(--lx-ink); }
.tut-next-btn { background: var(--lx-sage); color: #0C1A13; box-shadow: 0 3px 0 var(--lx-sage-dk); }



/* ============================================================
 *  LEAGUES — the arena.
 * ============================================================ */
.lg-arena { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            background: linear-gradient(180deg, #120F0D 0%, #16120F 50%, #100D0B 100%); }
.la-light { position: absolute; top: -30vh; width: 70vw; height: 120vh; filter: blur(10px); }
.la-light.left  { left: -22vw;  background: radial-gradient(ellipse 45% 60% at 60% 30%, rgba(92,184,138,0.20), transparent 70%); transform: rotate(-14deg); }
.la-light.right { right: -22vw; background: radial-gradient(ellipse 45% 60% at 40% 30%, rgba(224,162,76,0.17), transparent 70%); transform: rotate(14deg); }
.la-court { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 48vh; }
.la-vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 85% 75% at 50% 40%, transparent 45%, rgba(8,6,5,0.6) 100%); }
:where(.lg-arena ~ *) { position: relative; z-index: 1; }

.lg-hero { text-align: center; padding-top: 2.4rem !important; }
.lg-hero h1 { font-size: clamp(2.2rem, 5vw, 3rem) !important; }
.lg-sub { margin: 0.55rem 0 0; font: 600 0.95rem 'Inter', sans-serif; color: #9A8F84; }

.lg-choice {
    position: relative; display: grid !important;
    grid-template-columns: 1fr auto 1fr !important; align-items: center; gap: 1rem !important;
    margin-top: 2rem !important;
}
.lg-card {
    grid-template-columns: 1fr !important; justify-items: center; text-align: center !important;
    gap: 0.7rem !important; padding: 1.6rem 1.3rem 1.4rem !important;
    border-radius: 22px !important; border-width: 2px !important; border-bottom-width: 5px !important;
    background: rgba(30,26,22,0.88) !important;
}
.lg-create { border-color: rgba(92,184,138,0.35) !important; border-bottom-color: #3E8C65 !important; }
.lg-join   { border-color: rgba(224,162,76,0.35) !important; border-bottom-color: #B37C33 !important; }
.lg-card:hover { transform: translateY(-4px) !important; }
.lg-create:hover { box-shadow: 0 18px 50px rgba(92,184,138,0.18) !important; }
.lg-join:hover   { box-shadow: 0 18px 50px rgba(224,162,76,0.16) !important; }
.lg-card:active { transform: translateY(2px) !important; border-bottom-width: 2px !important; }
.lg-ico { width: 64px !important; height: 64px !important; border-radius: 18px !important; }
.lg-ico svg { width: 36px !important; height: 36px !important; }
.lg-txt { align-items: center; }
.lg-title { font-size: 1.25rem !important; }
.lg-go { display: none !important; }
.lg-vs {
    width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
    font: 900 1rem 'Inter', sans-serif; letter-spacing: 0.04em; color: #F4EEE6;
    background: radial-gradient(circle at 35% 30%, #3A322B, #1B1714);
    border: 2px solid rgba(236,226,214,0.18);
    box-shadow: 0 0 0 6px rgba(20,16,14,0.8), 0 10px 30px rgba(0,0,0,0.5);
}
@media (max-width: 640px) { .lg-choice { grid-template-columns: 1fr !important; } .lg-vs { justify-self: center; } }

.lg-empty { padding: 1.6rem 1.4rem 1.4rem !important; background: rgba(30,26,22,0.8) !important; }
.lg-steps { list-style: none; margin: 1.2rem 0 0; padding: 0; counter-reset: st;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; text-align: left; }
.lg-steps li { counter-increment: st; position: relative; padding: 0.8rem 0.8rem 0.8rem 2.6rem;
               border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(236,226,214,0.08); }
.lg-steps li::before { content: counter(st); position: absolute; left: 0.75rem; top: 0.8rem;
    width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center;
    font: 800 0.7rem 'Inter', sans-serif; background: rgba(92,184,138,0.16); color: #7BD3A6; }
.lg-steps b { display: block; font: 800 0.86rem 'Inter', sans-serif; color: #F4EEE6; }
.lg-steps span { display: block; font: 500 0.74rem 'Inter', sans-serif; color: #9A8F84; margin-top: 2px; }
@media (max-width: 640px) { .lg-steps { grid-template-columns: 1fr; } }

/* ============================================================
 *  LEAGUES v3 — stadium, mode select, match cards.
 * ============================================================ */
.lg-arena { background: #0E0C0A !important; }
.la-stadium { position: absolute; inset: 0; width: 100%; height: 100%; }
.la-vignette { background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 40%, rgba(6,5,4,0.75) 100%) !important; }

<script>
/* Crowd and lamps are generated rather than written out: a few hundred
   heads by hand would be most of this file. Seeded, so the crowd is the
   same every visit and nothing jumps around between loads. */
(function () {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const NS = 'http://www.w3.org/2000/svg';
    const crowd = document.getElementById('laCrowd');
    const tones = ['#2A231D', '#312820', '#241E19', '#3A2F25', '#2E2A22'];
    let out = '';
    for (let row = 0; row < 7; row++) {
        const t = row / 6;
        for (let x = -10; x < 1450; x += 13 + rnd() * 5) {
            const k = (x - 720) / 720;
            const yTop = 300 - 100 * (1 - k * k) + 22;          // follow the curve of the stand
            const y = yTop + row * 21 + rnd() * 4 + t * 8 - (1 - k * k) * t * 30;
            const r = 4.2 + t * 1.2;
            const tone = tones[Math.floor(rnd() * tones.length)];
            out += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + tone + '"/>' +
                   '<rect x="' + (x - r * 1.3).toFixed(1) + '" y="' + (y + r * 0.8).toFixed(1) + '" width="' + (r * 2.6).toFixed(1) + '" height="' + (r * 2).toFixed(1) + '" rx="' + r.toFixed(1) + '" fill="' + tone + '"/>';
            const roll = rnd();
            if (roll < 0.018) out += '<circle cx="' + x.toFixed(1) + '" cy="' + (y - 1).toFixed(1) + '" r="2.2" fill="#FFF6E0" opacity="0.8"/>';        // a camera flash
            else if (roll < 0.05) out += '<circle cx="' + x.toFixed(1) + '" cy="' + (y + 5).toFixed(1) + '" r="3" fill="' + (x < 720 ? '#5CB88A' : '#E0A24C') + '" opacity="0.5"/>';  // a scarf
        }
    }
    crowd.innerHTML = out;
    let lamps = '';
    [100, 1240].forEach(x0 => {
        for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
            const cx = x0 + 14 + c * 26, cy = 54 + r * 22;
            lamps += '<circle cx="' + cx + '" cy="' + cy + '" r="22" fill="url(#laLamp)" opacity="0.5"/>' +
                     '<circle cx="' + cx + '" cy="' + cy + '" r="6.5" fill="#FFF6E0"/>';
        }
    });
    document.getElementById('laLamps').innerHTML = lamps;
})();
</script>

<script>
/* ============================================================
 *  Leagues — list, create, join.
 * ============================================================ */
(function () {
    'use strict';

    const listEl  = document.getElementById('leaguesList');
    const countEl = document.getElementById('leagueCount');

    function sfx(n) { if (window.FTJuice && FTJuice.sfx[n]) FTJuice.sfx[n](); }

    /* Text is inserted with textContent, never interpolated into HTML —
       a league name is whatever another player typed. */
    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    document.getElementById('icoCreate').innerHTML = FTArt.node('trophy', 34);
    document.getElementById('icoJoin').innerHTML   = FTArt.node('target', 34);

    /* ── join by code ─────────────────────────────────────── */
    const sheet = document.getElementById('joinPopup');
    const codeEl = document.getElementById('popupLeagueCode');
    const errEl  = document.getElementById('joinError');

    window.openJoinPopup = function () {
        errEl.textContent = '';
        sheet.classList.add('open');
        sfx('pop');
        setTimeout(() => codeEl.focus(), 180);
    };
    window.closeJoinPopup = function () {
        sheet.classList.remove('open');
    };
    sheet.addEventListener('click', e => { if (e.target === sheet) closeJoinPopup(); });
    addEventListener('keydown', e => { if (e.key === 'Escape') closeJoinPopup(); });
    codeEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submitJoinCode(); }
    });

    window.submitJoinCode = async function () {
        const code = codeEl.value.trim();
        if (code.length < 3) {
            errEl.textContent = "That's too short to be a league code.";
            sfx('wrong');
            return;
        }
        if (!SL.configured) {
            errEl.textContent = 'Not connected — leagues need the server.';
            sfx('wrong');
            return;
        }
        const btn = document.getElementById('joinConfirm');
        btn.disabled = true; btn.textContent = 'Joining…';
        errEl.textContent = '';
        try {
            const league = await SL.joinLeague(code);
            sfx('correct');
            location.href = 'your-league.html?league=' + encodeURIComponent(league.id);
        } catch (e) {
            errEl.textContent = e.message || "No league with that code.";
            sfx('wrong');
            btn.disabled = false; btn.textContent = 'Join';
        }
    };

    /* ── the list ─────────────────────────────────────────── */
    const STATUS_TEXT = {
        lobby: 'Waiting to draft', pending: 'Waiting to draft',
        drafting: 'Drafting', active: 'Live',
        complete: 'Ended', completed: 'Ended',
    };

    function timeLeft(lg) {
        const weeks = Number(lg.duration_weeks) || 4;
        if (lg.status === 'complete' || lg.status === 'completed') return 'Ended';
        if (lg.status === 'lobby') return weeks + ' week season';
        if (!lg.created_at) return weeks + ' week season';
        const end = new Date(lg.created_at).getTime() + weeks * 7 * 86400000;
        const days = Math.ceil((end - Date.now()) / 86400000);
        if (days > 1)  return days + ' days left';
        if (days === 1) return 'Final day';
        return 'Ended';
    }

    function emptyState(msg) {
        listEl.innerHTML = '';
        const box = el('div', 'lg-empty');
        const art = el('div', 'lg-empty-art');
        art.innerHTML = FTArt.node('trophy', 66);
        box.appendChild(art);
        box.appendChild(el('h3', null, 'No leagues yet'));
        box.appendChild(el('p', null, msg));
        // what a season looks like, so an empty page still says what to do
        const steps = el('ol', 'lg-steps');
        [['Start or join', 'Make a league, or use a friend\u2019s code'],
         ['Draft', 'Take turns picking real stocks'],
         ['Win the week', 'Beat your matchup, climb the table']].forEach(([t, d]) => {
            const li = el('li');
            li.appendChild(el('b', null, t));
            li.appendChild(el('span', null, d));
            steps.appendChild(li);
        });
        box.appendChild(steps);
        listEl.appendChild(box);
        countEl.textContent = '';
    }

    function row(lg) {
        const r = el('div', 'lg-row');

        /* a crest: the league's initials on a shield in a colour of its own */
        const CRESTS = ['#5CB88A', '#E0A24C', '#9DB8FF', '#E8867F', '#C9A0E8', '#7FD1C7'];
        const nm = String(lg.name || 'League');
        let h = 0; for (let i = 0; i < nm.length; i++) h = (h * 31 + nm.charCodeAt(i)) | 0;
        const cc = CRESTS[Math.abs(h) % CRESTS.length];
        const ini = nm.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'L';
        const av = el('div', 'lg-avatar lg-crest');
        av.innerHTML = '<svg viewBox="0 0 40 46"><path d="M20 2 L37 8 V24 C37 35 29 41 20 44 C11 41 3 35 3 24 V8 Z" fill="' + cc + '" fill-opacity="0.16" stroke="' + cc + '" stroke-width="2.2"/>' +
            '<text x="20" y="28" text-anchor="middle" font-family="Barlow Condensed, Inter, sans-serif" font-style="italic" font-weight="900" font-size="16" fill="' + cc + '"></text></svg>';
        av.querySelector('text').textContent = ini;
        r.appendChild(av);
        r.style.setProperty('--crest', cc);

        const mid = el('div');
        mid.appendChild(el('div', 'lg-name', lg.name || 'Untitled league'));
        const meta = el('div', 'lg-meta');
        const code = el('span');
        code.appendChild(el('b', 'lg-code', lg.join_code || '—'));
        meta.appendChild(code);
        const seats = el('span');
        const n = el('b', 'memberCount', '…');
        n.dataset.league = lg.id;
        seats.appendChild(n);
        seats.appendChild(document.createTextNode(' of ' + (lg.max_players || '?') + ' players'));
        const pips = el('i', 'lg-pips');
        pips.dataset.league = lg.id;
        pips.dataset.max = Math.min(12, Number(lg.max_players) || 0);
        seats.appendChild(pips);
        meta.appendChild(seats);
        meta.appendChild(el('span', null,
            '$' + Number(lg.starting_capital || 100000).toLocaleString('en-US') + ' start'));
        meta.appendChild(el('span', null, timeLeft(lg)));
        mid.appendChild(meta);
        r.appendChild(mid);

        const right = el('div', 'lg-right');
        const st = lg.status || 'lobby';
        right.appendChild(el('span', 'lg-status ' + st, STATUS_TEXT[st] || st));
        const open = el('button', 'lg-open', 'Enter');
        open.onclick = () => {
            sfx('tap');
            location.href = 'your-league.html?league=' + encodeURIComponent(lg.id);
        };
        right.appendChild(open);
        r.appendChild(right);
        return r;
    }

    function paint(leagues) {
        if (!leagues.length) {
            emptyState('Create one above, or join a friend’s with their code.');
            return;
        }
        listEl.innerHTML = '';
        leagues.forEach(lg => listEl.appendChild(row(lg)));
        countEl.textContent = leagues.length + (leagues.length === 1 ? ' league' : ' leagues');
    }

    async function load() {
        if (!SL.configured) {
            // demo mode: whatever the local create flow left behind
            let local = [];
            try { local = JSON.parse(localStorage.getItem('stockLeagues') || '[]'); } catch (e) {}
            paint(local.map(l => ({
                id: l.leagueCode, name: l.name, join_code: l.leagueCode,
                max_players: l.players, starting_capital: l.startingCapital,
                duration_weeks: l.duration, created_at: l.createdAt, status: l.status || 'lobby',
            })));
            return;
        }

        let rows;
        try { rows = await SL.myLeagues(); }
        catch (e) {
            emptyState('Could not reach the server. Try again in a moment.');
            return;
        }
        const mine = (rows || []).map(r => r.leagues).filter(Boolean);
        paint(mine);

        /* Seat counts are a second round-trip each, so the rows render
           immediately with a placeholder and fill in as they land. */
        mine.forEach(async lg => {
            try {
                const members = await SL.getLeagueMembers(lg.id);
                document.querySelectorAll('.memberCount[data-league="' + lg.id + '"]')
                    .forEach(n => { n.textContent = members.length; });
                document.querySelectorAll('.lg-pips[data-league="' + lg.id + '"]').forEach(p => {
                    const max = Number(p.dataset.max) || 0;
                    p.innerHTML = Array.from({ length: max }, (_, i) => '<b class="' + (i < members.length ? 'on' : '') + '"></b>').join('');
                });
            } catch (e) {
                document.querySelectorAll('.memberCount[data-league="' + lg.id + '"]')
                    .forEach(n => { n.textContent = '?'; });
            }
        });
    }

    load();
})();
</script>

<script>
/* ============================================================
 *  Guided tour — league.html?tutorial. Steps 1 and 2 of the
 *  app-wide 9-step tour; it hands back to the dashboard after.
 * ============================================================ */
(function () {
    'use strict';
    if (!location.search.includes('tutorial')) return;

    const TOTAL = 9;
    const returnStep = Number(localStorage.getItem('tutorialReturnStep') || '7');

    const STEPS = [
        { sel: '.lg-card.lg-create', title: 'Create a League',
          desc: 'Start your own competition. Invite friends, set the rules, see who comes out on top.' },
        { sel: '.lg-card.lg-join', title: 'Join a League',
          desc: "Got a code from a friend? Drop it in and you're playing them head to head." },
    ];

    function place(target) {
        const rect = target.getBoundingClientRect();
        const pad = 8;
        const w = rect.width + pad * 2, h = rect.height + pad * 2;
        const x = rect.left - pad, y = rect.top - pad;

        const cut = document.getElementById('tutCutout');
        cut.setAttribute('x', x); cut.setAttribute('y', y);
        cut.setAttribute('width', w); cut.setAttribute('height', h);

        const b = document.getElementById('tutBorder');
        b.style.left = x + 'px'; b.style.top = y + 'px';
        b.style.width = w + 'px'; b.style.height = h + 'px';

        const tip = document.getElementById('tutTooltip');
        requestAnimationFrame(() => {
            const tipH = tip.offsetHeight;
            const below = innerHeight - (y + h);
            let top = below >= tipH + 14 ? y + h + 12 : Math.max(12, y - 12 - tipH);
            if (top + tipH > innerHeight - 12) top = innerHeight - tipH - 12;
            let left = rect.left + rect.width / 2 - 150;
            left = Math.max(12, Math.min(left, innerWidth - 312));
            tip.style.top = top + 'px'; tip.style.left = left + 'px';
            tip.classList.add('visible');
        });
    }

    let at = 0, resizeTimer = null;

    function show(i) {
        const backdrop = document.getElementById('tutBackdrop');
        const step = STEPS[i];
        const target = step && document.querySelector(step.sel);

        /* Never strand anyone under the backdrop: if a target is missing,
           take the overlay down and move the tour on rather than freezing
           the page behind a black sheet with no tooltip. */
        if (!target) {
            backdrop.classList.remove('active');
            document.getElementById('tutTooltip').classList.remove('visible');
            if (i + 1 < STEPS.length) show(i + 1); else tutBackToDash();
            return;
        }

        at = i;
        backdrop.classList.add('active');
        document.getElementById('tutTooltip').classList.remove('visible');

        const global = returnStep + i;
        document.getElementById('tutStepLabel').textContent = global + ' of ' + TOTAL;
        document.getElementById('tutTitle').textContent = step.title;
        document.getElementById('tutDesc').textContent = step.desc;
        document.getElementById('tutProgress').innerHTML =
            Array.from({ length: TOTAL }, (_, k) => {
                const cls = k + 1 < global ? 'done' : k + 1 === global ? 'active' : '';
                return '<div class="tut-tooltip-pip ' + cls + '"></div>';
            }).join('');

        const skip = document.querySelector('.tut-secondary-btn');
        const next = document.querySelector('.tut-next-btn');
        skip.textContent = 'Not now';
        skip.onclick = () => { location.href = 'dashboard.html'; };
        next.textContent = 'Next';
        next.onclick = () => { (i + 1 < STEPS.length) ? show(i + 1) : tutBackToDash(); };

        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => place(target), 500);
    }

    /* One resize listener for the whole tour. The old version added a fresh
       one on every step, so by step two the handler ran twice per resize. */
    addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const s = STEPS[at];
            const t = s && document.querySelector(s.sel);
            if (t && document.getElementById('tutBackdrop').classList.contains('active')) place(t);
        }, 250);
    });

    window.tutBackToDash = function () {
        localStorage.setItem('tutorialStep', '3');
        localStorage.setItem('tutorialReturnStep', '9');
        localStorage.setItem('tutorialActive', 'true');
        location.href = 'dashboard.html?tutorial=true';
    };
    window.endTutorial = function () {
        ['showTutorial', 'tutorialStep', 'tutorialActive', 'tutorialReturnStep']
            .forEach(k => localStorage.removeItem(k));
        location.href = 'dashboard.html';
    };

    setTimeout(() => show(0), 600);
})();
</script>
