/* ============================================================
 *  THE MAIN MENU
 *
 *  Built like a game's title screen, not a web page: the artwork
 *  is the whole screen, the menu is words set straight on it, and
 *  there are no cards, panels or boxes anywhere.
 *
 *     top-left      the wordmark (Rally walks on it)
 *     left          the menu — four big items, five small ones
 *     top-right     your player badge: level, name, capital
 *     bottom-right  the markets
 *     bottom-left   the feed: today's headline, the race
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    overflow: hidden; background: #0E0B09; color: #F4EEE6;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
}
.cnd { font-family: 'Barlow Condensed', 'Inter', sans-serif; font-style: italic; text-transform: uppercase; }

/* ── the scene ───────────────────────────────────────────── */
.ow-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background:
        radial-gradient(ellipse 38% 55% at 62% 52%, rgba(92,184,138,0.16), transparent 70%),
        radial-gradient(ellipse 30% 50% at 86% 60%, rgba(217,100,92,0.14), transparent 70%),
        radial-gradient(ellipse 90% 70% at 70% 40%, #1C1712 0%, #0E0B09 70%); }
.ow-art { position: absolute; right: -2vw; top: 6vh; width: 74vw; height: 90vh; }
.ow-art .hero-fill { opacity: 0.10; }
.ow-art .trace-shift { transform: translate(-19px, -6px); }
.ow-art #traceBull, .ow-art #traceBear { stroke-width: 3.2 !important; }
/* the left third darkens so the menu reads, the floor fades out */
.ow-scene::after { content: ''; position: absolute; inset: 0;
    background:
        linear-gradient(90deg, rgba(14,11,9,0.92) 0%, rgba(14,11,9,0.55) 32%, rgba(14,11,9,0) 55%),
        linear-gradient(0deg, rgba(14,11,9,0.85) 0%, rgba(14,11,9,0) 28%); }

[hidden] { display: none !important; }
/* room above the wordmark: Rally stands on the letters and must not be cut off */
.ow { position: relative; z-index: 1; height: 100vh; padding: max(84px, 9vh) 3.4vw 2.6vh;
      display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; }

/* ── wordmark ────────────────────────────────────────────── */
.ow-brand { grid-column: 1; grid-row: 1; align-self: start; }
.ft-wordmark { position: relative; display: inline-block; }
.main-title { margin: 0; font-family: 'Barlow Condensed', 'Inter', sans-serif; font-style: italic; font-weight: 900;
    font-size: clamp(2.7rem, 4.7vw, 4.5rem); line-height: 0.95; letter-spacing: 0.005em; text-transform: uppercase;
    color: #F4EEE6; text-shadow: 0 3px 18px rgba(0,0,0,0.6); }
.main-title span { color: #5CB88A; }
.ow-build { margin-top: 0.3rem; font: 700 0.72rem 'Inter', sans-serif; letter-spacing: 0.18em; color: rgba(244,238,230,0.42); }

/* ── the menu ────────────────────────────────────────────── */
.ow-menu { grid-column: 1; grid-row: 2; align-self: center; display: flex; flex-direction: column; margin-top: -2vh; }
.ow-item { display: inline-flex; align-items: center; gap: 0.6rem; width: max-content;
    color: #F4EEE6; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer;
    font-family: 'Barlow Condensed', 'Inter', sans-serif; font-style: italic; text-transform: uppercase;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
    transition: color 0.14s ease, transform 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
.ow-item.big { font-weight: 800; font-size: clamp(2.3rem, 4.4vw, 3.6rem); line-height: 1.04; }
.ow-item.small { font-weight: 700; font-size: clamp(1.15rem, 1.6vw, 1.45rem); line-height: 1.32; color: rgba(244,238,230,0.78); }
.ow-gap { height: 1.4vh; }
.ow-item::before { content: ''; width: 0; height: 0.62em; background: #F0B865; transform: skewX(-14deg);
    transition: width 0.16s ease; }
.ow-item:hover, .ow-item:focus-visible { color: #F0B865; transform: translateX(6px); outline: none; }
.ow-item:hover::before, .ow-item:focus-visible::before { width: 0.3em; }
.ow-item.small:hover::before, .ow-item.small:focus-visible::before { width: 0.22em; }
.ow-item:active { transform: translateX(10px) scale(0.98); }
/* Play is the main thing to do here, so it wears the hover colour all the time */
.ow-item.play { color: #F0B865; }
.ow-item.play::before { width: 0.3em; }
.ow-badge-n { font: 800 0.72rem 'Inter', sans-serif; font-style: normal; color: #1B1207; background: #F0B865;
    padding: 0.08rem 0.42rem; border-radius: 3px; transform: skewX(-10deg); text-shadow: none; }
.ow-badge-n[hidden] { display: none; }

/* ── player badge: your avatar, name and title ──────────── */
.ow-top { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; margin-top: calc(-1 * max(84px, 9vh) + 3.2vh); display: flex; align-items: center; gap: 1.1rem; }
/* the time, and whether the market is open, beside your badge */
.ow-clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.ow-clock b { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 1.55rem; color: #F4EEE6; font-variant-numeric: tabular-nums; }
.ow-mstate { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 4px; font: 700 0.62rem 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(244,238,230,0.55); }
.ow-player { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; padding: 0.3rem 1.1rem 0.3rem 0.3rem;
    border-radius: 999px; background: rgba(12,10,8,0.55); border: 1px solid rgba(244,238,230,0.10); transition: border-color 0.15s ease, background 0.15s ease; }
.ow-player:hover { border-color: rgba(240,184,101,0.55); background: rgba(12,10,8,0.75); }
.ow-av { display: block; width: 54px; height: 56px; }
.ow-av svg { display: block; }
.ow-name { display: block; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 1.3rem; text-transform: uppercase; line-height: 1.05; }
.ow-rank { display: block; font: 800 0.66rem 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #F0B865; }

/* ── bottom-right: markets ───────────────────────────────── */
.ow-markets { grid-column: 2; grid-row: 3; justify-self: end; align-self: end; text-align: right; }
.ow-markets .k { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 2.2rem; text-transform: uppercase; line-height: 1; }
.ow-mstate i { width: 7px; height: 7px; border-radius: 50%; background: #D9645C; }
.ow-mstate i.open { background: #5CB88A; box-shadow: 0 0 8px #5CB88A; }
.ow-mk { display: flex; justify-content: flex-end; gap: 1.4rem; margin-top: 0.35rem; }
.ow-mk div { font: 700 0.72rem 'Inter', sans-serif; letter-spacing: 0.06em; color: rgba(244,238,230,0.55); text-transform: uppercase; }
.ow-mk b { display: block; margin-top: 2px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 1.3rem; letter-spacing: 0; color: #F4EEE6; text-transform: none; font-variant-numeric: tabular-nums; }
.ow-mk em { font-style: normal; font-weight: 800; }
.ow-mk .up em { color: #7BD3A6; } .ow-mk .down em { color: #E8867F; }

/* ── bottom-left: one news card, then small chips ─────────── */
.ow-feed { grid-column: 1; grid-row: 3; align-self: end; max-width: 520px; }
.ow-news { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0.9rem 0.5rem 0.5rem; margin-bottom: 0.7rem; text-decoration: none; color: inherit;
    border-radius: 12px; background: rgba(12,10,8,0.55); border: 1px solid rgba(244,238,230,0.08); transition: border-color 0.15s ease, background 0.15s ease; }
.ow-news:hover { border-color: rgba(240,184,101,0.45); background: rgba(12,10,8,0.75); }
.ow-news-img { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; display: grid; place-items: center;
    background: linear-gradient(135deg, #3A2E22, #1E1813); font: 900 1.6rem 'Barlow Condensed', sans-serif; font-style: italic; color: #F0B865; }
.ow-news-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ow-news-txt { min-width: 0; transition: opacity 0.35s ease; }
.ow-news-txt.fade { opacity: 0; }
.ow-news-k { display: block; font: 800 0.62rem 'Inter', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #F0B865; }
.ow-news-h { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px;
    font: 700 0.9rem/1.3 'Inter', sans-serif; color: #F4EEE6; }
.ow-chip { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.22rem 0.7rem; transform: skewX(-12deg); text-decoration: none;
    background: rgba(12,10,8,0.55); border: 1px solid rgba(244,238,230,0.12); color: rgba(244,238,230,0.8); transition: border-color 0.15s ease; }
.ow-chip > * { transform: skewX(12deg); }
.ow-chip[hidden] { display: none !important; }
.ow-chip:hover { border-color: rgba(240,184,101,0.55); color: #F4EEE6; }
.ow-chip b { font: 900 0.8rem 'Barlow Condensed', sans-serif; font-style: italic; letter-spacing: 0.08em; text-transform: uppercase; color: #7BD3A6; }
.ow-chip.league b { color: #9DB8D2; }
.ow-chip span { font: 800 0.72rem 'Inter', sans-serif; font-variant-numeric: tabular-nums; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ow-race { position: relative; width: 38px; height: 5px; background: rgba(244,238,230,0.12); overflow: hidden; }
.ow-race i { position: absolute; inset: 0 auto 0 0; width: 0; background: #5CB88A; transition: width 0.8s cubic-bezier(0.2,0.9,0.25,1); }
.ow-race i.neg { background: #D9645C; }
.ow-feed .tag.news { color: #F0B865; background: rgba(240,184,101,0.12); } .ow-feed .tag.race { color: #7BD3A6; background: rgba(92,184,138,0.12); } .ow-feed .tag.league { color: #9DB8D2; background: rgba(157,184,210,0.12); }
.ow-tools { display: flex; align-items: center; gap: 1rem; margin-top: 0.55rem; }
.ow-switch { display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer; user-select: none;
    font: 700 0.7rem 'Inter', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,238,230,0.5); }
.ow-switch input { position: absolute; opacity: 0; pointer-events: none; }
.ow-switch .t { width: 28px; height: 14px; border-radius: 999px; background: rgba(244,238,230,0.2); position: relative; transition: background 0.15s ease; }
.ow-switch .t::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #F4EEE6; transition: transform 0.15s ease; }
.ow-switch input:checked + .t { background: #3E8C65; }
.ow-switch input:checked + .t::after { transform: translateX(14px); }
.ow-switch input:focus-visible + .t { outline: 2px solid #F0B865; outline-offset: 2px; }
.ow-legal { white-space: nowrap; font: 500 0.64rem 'Inter', sans-serif; color: rgba(244,238,230,0.3); }

/* ── entrance ─────────────────────────────────────────────── */
.ow-brand, .ow-menu > *, .ow-top, .ow-markets, .ow-feed { animation: owIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
.ow-menu > *:nth-child(1) { animation-delay: 0.05s; } .ow-menu > *:nth-child(2) { animation-delay: 0.09s; }
.ow-menu > *:nth-child(3) { animation-delay: 0.13s; } .ow-menu > *:nth-child(4) { animation-delay: 0.17s; }
.ow-menu > *:nth-child(n+5) { animation-delay: 0.22s; }
@keyframes owIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.ow-top, .ow-markets { animation-name: owInR; }
@keyframes owInR { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ow-brand, .ow-menu > *, .ow-top, .ow-markets, .ow-feed { animation: none; } }

    .ow-mk { justify-content: flex-start; }
    .ow-feed { grid-row: 5; }
    .ow-art { width: 140vw; right: -50vw; opacity: 0.5; }

        .ft-wordmark { position: relative; }
        /* Spans the wordmark box; the script positions him inside it against
           the measured ink of the glyphs, not against this box. */
        .ft-ledge {
            position: absolute; inset: 0;
            height: 0; pointer-events: none;
        }
        .ft-rally {
            /* his hooves sit at 93.9% of the rig box, so bottom:0 lands them
               a few px inside the cap height — the -1 stands him ON the
               letters rather than in them */
            /* `top` is written by the script from the measured cap height of
               the wordmark — bottom:100% of the heading box put his hooves
               about 10px above the letters, which parked him on the BETA
               line instead of on the word. */
            position: absolute; left: 0; top: 0;
            width: 74px; height: 74px;
            pointer-events: auto; cursor: pointer;
            /* Position is driven frame by frame, so there is deliberately no
               transition here — a CSS transition would fight the loop and
               turn a walk into a series of slides. */
            will-change: transform;
        }
        .ft-rally .bull-rig { width: 74px; height: 74px; }
        .ft-rally .bull-shadow {
            position: absolute; left: 50%; bottom: 3px;
            width: 42%; height: 6px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.45); filter: blur(3px);
            transform: translateX(-50%);
        }
        .ft-rally.leaving {
            /* the loop writes translateX every frame, so the exit animates
               opacity and scale on a wrapper-free element instead of trying
               to win a transform fight it would lose */
            transition: opacity 0.45s ease;
            opacity: 0;
        }
        /* a one-off puff of dust when he lands from a buck */
        .ft-rally-tip {
            position: absolute; bottom: calc(100% + 4px); left: 50%;
            transform: translateX(-50%);
            background: var(--lx-surface, #221D19);
            border: 1px solid rgba(236, 226, 214, 0.18);
            border-radius: 9px; padding: 0.28rem 0.55rem;
            font: 600 0.64rem 'Inter', sans-serif; color: #B7ADA1;
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .ft-rally:hover .ft-rally-tip { opacity: 1; }

<script>
/* ── clock and market state ─────────────────────────────── */
function marketIsOpen() {
    try {
        const et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
        const d = et.getDay(), m = et.getHours() * 60 + et.getMinutes();
        return d >= 1 && d <= 5 && m >= 570 && m < 960;
    } catch (e) { return false; }
}
function updateNavClock() {

    if (c) c.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const open = marketIsOpen();

    if (dot) dot.className = open ? 'open' : '';
    if (st) st.textContent = open ? 'Market open' : 'Market closed';
}

/* ── your name and level ────────────────────────────────── */
(async function () {

                const { data } = await SL.client.from('profiles').select('username, full_name').eq('id', me.id).maybeSingle();
                name = (data && (data.username || data.full_name)) || '';
            }
            if (!name && me && me.email) name = me.email.split('@')[0];

/* ── market headlines ───────────────────────────────────────
   A free-text query ("stock market today") comes back from Yahoo with
   no news at all, which is why this line used to say headlines were
   unavailable. A ticker query always carries news, so ask for the S&P
   500 (then SPY), keep the newest, and rotate through a few of them. */
(function () {
    const h = document.getElementById('dashNewsHeadline'), meta = document.getElementById('dashNewsMeta');
    const link = document.getElementById('feedNews'), img = document.getElementById('newsImg'), txt = document.getElementById('newsTxt');
    // the smallest thumbnail that is still sharp at 64px (2x)
    const thumb = n => {
        const r = (n && n.thumbnail && n.thumbnail.resolutions) || [];
        const ok = r.filter(x => x && x.url && x.width >= 110).sort((a, b) => a.width - b.width);
        return (ok[0] || r[0] || {}).url || null;
    };
    const ago = t => { const m = Math.max(1, Math.round((Date.now() / 1000 - t) / 60));
        return m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
    async function search(q) {
        const path = '/v1/finance/search?q=' + encodeURIComponent(q) + '&newsCount=10&quotesCount=0';
        try {
            if (typeof stockDataService !== 'undefined') {
                const j = await stockDataService.fetchYahoo(path, 5000);
                if (j && j.news && j.news.length) return j.news;
            }
        } catch (e) {}
        try {
            const res = await fetch(window.SUPABASE_URL + '/functions/v1/market-data?type=search&q=' + encodeURIComponent(q) + '&newsCount=10&quotesCount=0',
                { headers: { apikey: window.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + window.SUPABASE_ANON_KEY } });
            const j = await res.json();
            if (j && j.news && j.news.length) return j.news;
        } catch (e) {}
        return [];
    }
    let items = [], at = 0, timer = null;
    function show(i) {
        const n = items[i]; if (!n) return;
        txt.classList.add('fade');
        setTimeout(() => {
            h.textContent = n.title;
            meta.textContent = [n.publisher || 'Market news', n.providerPublishTime ? ago(n.providerPublishTime) : ''].filter(Boolean).join(' \u00b7 ');
            if (n.link) { link.href = n.link; link.target = '_blank'; link.rel = 'noopener'; }
            const u = thumb(n);
            img.textContent = '';
            const letter = () => { img.textContent = String(n.publisher || 'N').trim().charAt(0).toUpperCase(); };
            if (u) {
                const im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer';
                im.onerror = () => { im.remove(); letter(); };
                im.src = u; img.appendChild(im);
            } else letter();
            txt.classList.remove('fade');
        }, items.length > 1 ? 300 : 0);
    }
    async function load() {
        let news = await search('^GSPC');
        if (!news.length) news = await search('SPY');
        const MARKET = /\b(stocks?|market|dow|s&p|nasdaq|futures|fed|yields?|rates?|earnings|wall street|inflation)\b/i;
        news = news.filter(n => n && n.title)
            .sort((a, b) => (MARKET.test(b.title) - MARKET.test(a.title)) || ((b.providerPublishTime || 0) - (a.providerPublishTime || 0)));
        if (!news.length) {
            h.textContent = 'Read today’s market news';
            meta.textContent = 'Market news';
            link.href = 'news.html'; link.removeAttribute('target');
            return;
        }
        items = news.slice(0, 5); at = 0; show(0);
        clearInterval(timer);
        if (items.length > 1) timer = setInterval(() => { at = (at + 1) % items.length; show(at); }, 8000);
    }
    load();
    setInterval(load, 10 * 60 * 1000);
})();

/* ── the indices, last level kept when the market is shut ── */
(async function () {
    const rows = [['^GSPC', 'idxSP', 'S&P 500'], ['^DJI', 'idxDOW', 'Dow'], ['^IXIC', 'idxNAS', 'Nasdaq']];
    async function meta(sym) {
        try {
            if (typeof stockDataService !== 'undefined' && stockDataService.fetchYahoo) {
                const j = await stockDataService.fetchYahoo('/v8/finance/chart/' + encodeURIComponent(sym) + '?range=1d&interval=1d', 3500);
                const m = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
                if (m && m.regularMarketPrice != null) return m;
            }
        } catch (e) {}
        try {
            const u = window.SUPABASE_URL + '/functions/v1/market-data?symbol=' + encodeURIComponent(sym) + '&range=1d&interval=1d';
            const r = await fetch(u, { headers: { apikey: window.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + window.SUPABASE_ANON_KEY } });
            const j = await r.json();
            return j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
        } catch (e) { return null; }
    }
    await Promise.all(rows.map(async ([sym, id, label]) => {
        const el = document.getElementById(id), m = await meta(sym);
        if (!el || !m || m.regularMarketPrice == null) return;
        const px = Number(m.regularMarketPrice), prev = Number(m.chartPreviousClose != null ? m.chartPreviousClose : px);
        const pct = prev ? (px - prev) / prev * 100 : 0;
        el.className = pct >= 0 ? 'up' : 'down';
        el.innerHTML = label + '<b>' + px.toLocaleString(undefined, { maximumFractionDigits: 0 }) +
            ' <em>' + (pct >= 0 ? '+' : '−') + Math.abs(pct).toFixed(2) + '%</em></b>';
    }));
})();

/* ── the bull, then the bear, traced in light ───────────── */
(function () {
    const bull = document.getElementById('traceBull'), bear = document.getElementById('traceBear');
    if (!bull || !bear || !bull.getTotalLength) return;
    const prep = p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.style.opacity = 0; return L; };
    const LB = prep(bull), LR = prep(bear);
    const tick = f => (document.visibilityState === 'hidden' ? setTimeout(() => f(performance.now()), 33) : requestAnimationFrame(f));
    const run = (p, L, dur) => new Promise(res => {
        p.style.opacity = 0.9; const t0 = performance.now();
        (function step(t) { const k = Math.min(1, (t - t0) / dur); p.style.strokeDashoffset = L * (1 - k);
            if (k < 1) tick(step); else setTimeout(res, 800); })(t0);
    });
    const fade = (p, L) => { p.style.transition = 'opacity 0.9s ease'; p.style.opacity = 0;
        setTimeout(() => { p.style.transition = ''; p.style.strokeDashoffset = L; }, 950); };
    (async function loop() {
        await new Promise(r => setTimeout(r, 700));
        for (;;) {
            await run(bull, LB, 4300); await run(bear, LR, 4300);
            await new Promise(r => setTimeout(r, 1400));
            fade(bull, LB); fade(bear, LR);
            await new Promise(r => setTimeout(r, 1200));
        }
    })();
})();

/* ── feedback ───────────────────────────────────────────── */

async function sendFeedback() {
    const box = document.getElementById('fbText'), btn = document.getElementById('fbSend'), text = (box.value || '').trim();
    if (!text) { if (window.FT) FT.error('Write something first.'); box.focus(); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
        if (!(window.SL && SL.configured && SL.client)) throw new Error('Not connected to the server right now.');
        let user = null; try { user = await SL.currentUser(); } catch (e) {}
        const { error } = await SL.client.from('feedback').insert({
            user_id: user ? user.id : null,
            username: localStorage.getItem('username') || (user && user.email) || null,
            message: text.slice(0, 4000), page: 'dashboard.html',
            user_agent: (navigator.userAgent || '').slice(0, 300),
        });
        if (error) throw error;
        box.value = ''; document.getElementById('fbCount').textContent = '0 / 4000'; closeFeedback();
        if (window.FT) FT.success('Thanks — that went straight to Wyatt.');
    } catch (e) { const m = (e && e.message) || 'Could not send that.'; if (window.FT) FT.error(m); else alert(m); }
    finally { btn.disabled = false; btn.textContent = 'Send it'; }
}

/* ── your capital, live ─────────────────────────────────── */
(function () {
    const capEl = document.getElementById('heroCapital'), dayEl = document.getElementById('heroDay');
    const KEY = 'ftDayBaseline';
    const dk = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    function base(total) {
        const k = dk(new Date()); let s = null;
        try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
        if (s && s.key === k && s.value > 0) return s.value;
        try { localStorage.setItem(KEY, JSON.stringify({ key: k, value: total })); } catch (e) {}
        return total;
    }
    /* the +50% race, from the same numbers: practice accounts start at $10,000 */
    function paintRace(total) {
        const ret = (total - 10000) / 10000 * 100;
        const bar = document.getElementById('raceBar'), txt = document.getElementById('raceText');
        if (!bar || !txt) return;
        bar.classList.toggle('neg', ret < 0);
        bar.style.width = Math.max(0, Math.min(100, ret / 50 * 100)).toFixed(1) + '%';
        txt.textContent = ret >= 50 ? 'You won' : (ret >= 0 ? '+' : '\u2212') + Math.abs(ret).toFixed(1) + '% / 50';
    }
    let busy = false, timer = null;
    async function pull() {
        if (busy || !window.SL || !SL.configured) return; busy = true;
        try {
            const user = await SL.currentUser(); if (!user) return;
            const pf = await SL.loadPortfolio(); const syms = Object.keys(pf.stocks || {});
            const q = syms.length ? await SL.getLiveQuotes(syms) : {};
            let v = 0; syms.forEach(s => { const pos = pf.stocks[s] || {}, r = q[s];
                v += (r && r.price != null ? Number(r.price) : Number(pos.avgPrice || 0)) * (pos.shares || 0); });
            const total = (pf.cash || 0) + v;
            if (capEl) capEl.textContent = '$' + total.toLocaleString(undefined, { maximumFractionDigits: 0 });
            /* today = what the holdings were worth at yesterday's close,
               from each quote's own change, not a number cached on first
               visit (which read 0% for anyone who opened the app late) */
            let prev = pf.cash || 0, known = false;
            syms.forEach(s => { const pos = pf.stocks[s] || {}, r = q[s];
                const px = r && r.price != null ? Number(r.price) : Number(pos.avgPrice || 0);
                const c = r && r.change_pct != null && r.stale !== true ? Number(r.change_pct) : 0;
                if (r && r.change_pct != null) known = true;
                prev += (c > -100 ? px / (1 + c / 100) : px) * (pos.shares || 0); });
            const pct = known && prev > 0 ? (total - prev) / prev * 100 : (() => { const b = base(total); return b > 0 ? (total - b) / b * 100 : 0; })();
            if (dayEl) {
                dayEl.className = pct > 0.005 ? 'up' : pct < -0.005 ? 'down' : 'flat';
                dayEl.textContent = (pct >= 0 ? '+' : '\u2212') + Math.abs(pct).toFixed(2) + '%';
            }
            paintRace(total);
        } catch (e) {} finally { busy = false; }
    }
    const start = () => { clearInterval(timer); pull(); timer = setInterval(pull, 45000); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); else clearInterval(timer); });
    window.addEventListener('ft:portfolio-changed', pull);
    let tries = 0; (function wait() { if (window.SL && SL.configured) return start(); if (++tries < 40) setTimeout(wait, 250); })();
})();
</script>

<script>

/* ============================================================
 *  Rally, shuffling along the wordmark.
 *
 *  Driven frame by frame rather than in discrete hops. An earlier
 *  version took a step every few seconds and stood still between
 *  them, which read as a picture that occasionally moved rather
 *  than an animal pottering about on a word.
 *
 *  He can be built and torn down at will, because the switch above
 *  the bottom strip turns him on and off — sending him away used
 *  to be permanent, with nothing anywhere to bring him back.
 *
 *  NOTE: this runs on an interval, not requestAnimationFrame. rAF
 *  does not fire while a document reports itself hidden, and some
 *  embedded browser surfaces report hidden even while on screen —
 *  which left him frozen. At 34px/s, 25fps is indistinguishable
 *  from 60, and browsers throttle background intervals anyway.
 * ============================================================ */
(function () {
    'use strict';
    const HIDE_KEY = 'ftDashRallyHidden';

    const ledge  = document.getElementById('rallyLedge');
    const title  = document.querySelector('.ft-wordmark .main-title');
    const toggle = document.getElementById('rallyToggleInput');
    if (!ledge || !title || !window.FTBull) return;

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let el = null, tick = 0, onResize = null;

    function build() {
        if (el) return;

        /* A dismissed bull hangs around for half a second while it fades.
           Flick the switch quickly and you would stack several of them on
           the word at once — they all clear themselves, but not before you
           see it. Anything still on its way out goes now. */
        ledge.querySelectorAll('.ft-rally').forEach(function (old) { old.remove(); });

        el = document.createElement('div');
        el.className = 'ft-rally';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', 'Send Rally away');
        el.innerHTML = FTBull.rigSVG() +
            '<span class="bull-shadow"></span>' +
            '<span class="ft-rally-tip">Click to send me off</span>';
        ledge.appendChild(el);

        const rig = el.querySelector('.bull-rig');
        let state = '';
        function setState(n) {
            if (n === state) return;      // re-setting restarts the animation
            state = n;
            rig.setAttribute('class', 'bull-rig is-' + n);
        }
        setState('idle');

        /* ── the terrain ──────────────────────────────────────────
           He was standing at one fixed height: the tallest ink in the
           whole string. Over the F, the T or the d that touches; over
           the lowercase a-n-s-y-e it left him hovering about 15px up,
           which is what made him look like he was floating above the
           word rather than standing on it.

           So measure the word's actual silhouette. The heading is drawn
           to an offscreen canvas at the same font and size, then each
           pixel column is scanned for its topmost ink. That gives a
           height profile, and he walks over it — up onto the capitals,
           down across the lowercase. */
        let span = 0;
        let profile = null;      // ink top per px column, relative to baseline
        let textLeft = 0, baselineY = 0;

        // his hooves occupy the middle ~40% of the rig box
        const HOOF_L = 0.30, HOOF_R = 0.70, HOOF_Y = 0.939;
        /* Hooves landing exactly on the ink still reads as hovering — there
           is no contact cue on a flat dark background. Sinking him a few px
           into the letter tops is what makes him look planted on the word. */
        const SINK = 7;

        function measure() {
            const r = document.createRange();
            r.selectNodeContents(title);
            const text = r.getBoundingClientRect();
            const w = el.offsetWidth || 74;
            span = Math.max(0, Math.round(text.width - w));
            textLeft = text.left;

            // baseline: a zero-size inline-block aligns its bottom to it
            const probe = document.createElement('span');
            probe.style.cssText = 'display:inline-block;width:0;height:0';
            title.appendChild(probe);
            baselineY = probe.getBoundingClientRect().bottom;
            probe.remove();

            profile = null;
            try {
                const cs = getComputedStyle(title);
                const fs = parseFloat(cs.fontSize);
                /* The heading is uppercased by CSS. Drawing its raw text gave
                   a lowercase silhouette, so he sank into every capital. */
                let str = title.textContent.trim();
                if (cs.textTransform === 'uppercase') str = str.toUpperCase();
                const cw = Math.ceil(text.width);
                const ch = Math.ceil(fs * 2);
                const base = Math.round(fs * 1.4);       // baseline inside the canvas
                const cv = document.createElement('canvas');
                cv.width = cw; cv.height = ch;
                const ctx = cv.getContext('2d', { willReadFrequently: true });
                ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#fff';
                ctx.fillText(str, 0, base);

                const px = ctx.getImageData(0, 0, cw, ch).data;
                const prof = new Float32Array(cw);
                for (let cx = 0; cx < cw; cx++) {
                    let top = NaN;
                    for (let cy = 0; cy < ch; cy++) {
                        if (px[(cy * cw + cx) * 4 + 3] > 40) { top = cy; break; }
                    }
                    // distance ABOVE the baseline, so it survives any scaling
                    prof[cx] = isNaN(top) ? NaN : (base - top);
                }
                profile = prof;
            } catch (e) { /* fall through to the flat estimate below */ }
        }
        measure();

        /* Fonts can land after first paint, and the silhouette of a fallback
           face is not the silhouette of the real one. */
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () { if (el) measure(); });
        }

        /* Ink height under his hooves. He stands on the tallest thing beneath
           them, which is what a foot on uneven ground actually does — and it
           keeps him steady across the gaps between letters instead of
           dropping into every one. */
        function groundAt(localX) {
            const w = el.offsetWidth || 74;
            const fs = parseFloat(getComputedStyle(title).fontSize) || 67;
            if (!profile || !profile.length) return fs * 0.72;   // flat cap-height fallback
            const from = Math.round(localX + w * HOOF_L);
            const to   = Math.round(localX + w * HOOF_R);
            let best = NaN;
            for (let i = Math.max(0, from); i <= Math.min(profile.length - 1, to); i++) {
                const v = profile[i];
                if (!isNaN(v) && (isNaN(best) || v > best)) best = v;
            }
            return isNaN(best) ? 0 : best;      // 0 = baseline (a gap in the word)
        }

        let x = Math.random() * span;
        let dir = Math.random() < 0.5 ? -1 : 1;

        if (reduced) {
            const mid = Math.round(span / 2);
            const host = el.parentElement.getBoundingClientRect();
            el.style.transform = 'translateX(' + mid + 'px)';
            el.style.top = ((baselineY - groundAt(mid)) + 7 - host.top -
                            el.offsetHeight * 0.939).toFixed(1) + 'px';
            wireDismiss();
            return;
        }

        /* Matched to the stride in ft-bull.css (0.58s cycle, 62% of it
           with the hoof planted, legs 18px long at 74px): any faster and
           the hooves skate over the letters instead of stepping on them. */
        const SPEED = 36 * ((el.offsetWidth || 74) / 74);
        let mode = 'walk', until = 0, last = 0;
        let standY = (baselineY - groundAt(x)) + SINK -
                     el.parentElement.getBoundingClientRect().top - el.offsetHeight * HOOF_Y;
        el.style.top = standY.toFixed(1) + 'px';

        /* He has to actually get somewhere. Short bursts with a frequent
           turn made a random walk that stayed within about 70px of wherever
           it started — technically moving, visibly stuck in one spot. Long
           committed walks, turns mostly at the ends, and grazing rather than
           standing about during the stops. */
        function decide(now) {
            const roll = Math.random();
            if (roll < 0.30) {
                mode = 'graze'; until = now + 2200 + Math.random() * 2600; setState('graze');
            } else if (roll < 0.38) {
                mode = 'buck';  until = now + 950; setState('cheer');
            } else {
                mode = 'walk';  until = now + 3000 + Math.random() * 4000; setState('walk');
                /* Steer away from whichever end he is nearest. Left to a coin
                   flip he settles against one edge and grazes there; this is
                   what makes him work across the whole word instead of
                   haunting the first two letters. */
                if (span > 0) {
                    if (x < span * 0.25)      dir = 1;
                    else if (x > span * 0.75) dir = -1;
                    else if (roll > 0.90)     dir = -dir;
                }
            }
        }

        function frame() {
            const now = performance.now();
            if (!last) { last = now; until = now + 900; }
            /* Clamped so a long gap between ticks cannot teleport him. High
               enough that a throttled background tab still shuffles, low
               enough that returning after an hour does not fire him across
               the word. */
            const dt = Math.min(0.25, (now - last) / 1000);
            last = now;

            if (now >= until) decide(now);

            if (mode === 'walk' && span > 0) {
                x += dir * SPEED * dt;
                if (x <= 0)    { x = 0;    dir = 1; }
                if (x >= span) { x = span; dir = -1; }
            }

            /* Stand on the word, not above it: the ink height under his
               hooves, converted back into a page offset. Eased so stepping
               from a capital down to a lowercase is a step, not a snap. */
            const host = el.parentElement.getBoundingClientRect();
            const wantTop = (baselineY - groundAt(x)) + SINK - host.top - el.offsetHeight * HOOF_Y;
            standY += (wantTop - standY) * Math.min(1, dt * 9);
            el.style.top = standY.toFixed(1) + 'px';

            /* The rig is drawn facing LEFT — front legs at x=78/93, back legs
               at 112/127, tail off to the right. So the flip goes on when he
               walks RIGHT. It was the other way round, which had him moonwalking. */
            el.style.transform = 'translateX(' + x.toFixed(1) + 'px)' +
                                 (dir > 0 ? ' scaleX(-1)' : '');
        }
        tick = setInterval(frame, 40);
        frame();

        onResize = function () { measure(); if (x > span) x = span; };
        addEventListener('resize', onResize);
        wireDismiss();
    }

    function wireDismiss() {
        el.addEventListener('click', function () { setShown(false); });
        el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setShown(false); }
        });
    }

    function destroy(animate) {
        if (!el) return;
        clearInterval(tick); tick = 0;
        if (onResize) { removeEventListener('resize', onResize); onResize = null; }
        const going = el;
        el = null;
        if (!animate) { going.remove(); return; }
        going.classList.add('leaving');
        setTimeout(function () { going.remove(); }, 500);
    }

    /* One place decides whether he is on screen, so the switch, the click
       and the stored preference can never disagree. */
    function setShown(on, animate) {
        try { localStorage.setItem(HIDE_KEY, on ? '0' : '1'); } catch (e) {}
        if (toggle) toggle.checked = on;
        if (on) build(); else destroy(animate !== false);
    }

    let shown = true;
    try { shown = localStorage.getItem(HIDE_KEY) !== '1'; } catch (e) {}
    if (toggle) {
        toggle.checked = shown;
        toggle.addEventListener('change', function () { setShown(toggle.checked); });
    }
    if (shown) build();
})();

</script>
