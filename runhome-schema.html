      "name": "Are RunHome contractors licensed and insured?",

    {
      "@type": "Question",
      "name": "How much does RunHome cost?",

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If your garage door won't open, the fastest way to get help is to scan the door with the RunHome app. RunHome builds a 3D model of the issue and instantly sends it to vetted garage door repair contractors in Michigan who can quote and schedule the repair right from the app."
      }
    },

      "@type": "Question",
