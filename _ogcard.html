<!DOCTYPE html><html><head>
    <!-- ft-canvas: the page background, declared before anything that can
         block rendering. Every stylesheet on this page is render-blocking,
         so when one is slow Chrome gives up holding the previous frame and
         paints the default canvas — white — for a beat. That was the flash
         between pages. Inline and first, it can never be white. -->
    <style>html{background-color:#171310;}</style><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,550;1,9..144,550&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#171310;overflow:hidden;
  font-family:'Inter',sans-serif;color:#F2ECE3;position:relative}
body::before{content:'';position:absolute;inset:0;
  background:
    radial-gradient(700px 480px at 6% 2%, rgba(92,184,138,.10), transparent 70%),
    radial-gradient(680px 470px at 98% 34%, rgba(224,162,76,.075), transparent 70%),
    radial-gradient(640px 480px at 40% 110%, rgba(157,184,210,.055), transparent 70%)}
.grid{position:relative;height:100%;display:grid;grid-template-columns:0.93fr 1.07fr;
  gap:34px;align-items:center;padding:0 0 0 74px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.top img{width:52px}
.top b{font:800 1.35rem 'Inter';letter-spacing:-.02em}
.beta{font:700 .72rem 'Inter';letter-spacing:.16em;text-transform:uppercase;
  color:#E0A24C;border:1px solid rgba(224,162,76,.45);background:rgba(224,162,76,.12);
  padding:.28rem .6rem;margin-left:2px}
h1{font:550 3.35rem/1.06 'Fraunces',Georgia,serif;letter-spacing:-.025em}
h1 em{font-style:italic}
h1 .u{position:relative;white-space:nowrap}
h1 .u::after{content:'';position:absolute;left:2%;right:2%;bottom:.06em;height:.08em;
  background:#5CB88A;opacity:.7;border-radius:3px}
.sub{margin-top:20px;font:500 1.16rem 'Inter';color:#A89E92;letter-spacing:-.01em;max-width:26rem}
.foot{margin-top:26px;display:flex;align-items:center;gap:18px}
.pill{font:700 .88rem 'Inter';color:#171310;background:#5CB88A;padding:.6rem 1.35rem;border-radius:999px}
.meta{font:600 .9rem 'Inter';color:#6E655C}
.meta span{color:#A89E92}
/* the machine, angled exactly like the hero */
.zone{position:relative;perspective:1700px;padding-right:0}
.machine{transform:rotateY(-13deg) rotateX(3.5deg);transform-style:preserve-3d;width:660px}
.screen{position:relative;border-radius:15px;overflow:hidden;background:#0C0A08;padding:12px 12px 14px;
  border:1px solid rgba(240,232,220,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 28px 64px rgba(0,0,0,.55),
             0 80px 140px rgba(0,0,0,.36),-16px 26px 54px rgba(0,0,0,.3)}
.screen::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.06) 0%,transparent 28%,transparent 78%,rgba(255,255,255,.025) 100%)}
.cam{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:rgba(240,232,220,.16)}
.screen img{display:block;width:100%;border-radius:6px;background:#1A1714}
.base{height:14px;margin:0 -5.5%;border-radius:0 0 15px 15px;
  background:linear-gradient(180deg,#2A241F,#16120F);
  border:1px solid rgba(240,232,220,.1);border-top:none;
  box-shadow:0 20px 40px rgba(0,0,0,.45);display:flex;justify-content:center}
.base span{width:100px;height:5px;margin-top:1px;border-radius:0 0 8px 8px;background:rgba(0,0,0,.4)}
</style></head><body>
<div class="grid">
  <div>
    <div class="top"><img src="ft-logo-mark.png"><b>Fantasy Trader</b><span class="beta">Beta</span></div>
    <h1>Join <em>FantasyTrader</em><br><span class="u">today.</span></h1>
    <div class="sub">Fantasy football — but your players are real companies. We're in beta testing.</div>
    <div class="foot">
      <span class="pill">Come play →</span>
      <span class="meta"><span>5,000 live tickers</span> · $100k virtual</span>
    </div>
  </div>
  <div class="zone">
    <div class="machine">
      <div class="screen"><div class="cam"></div><img src="shots/dashboard.jpg"></div>
      <div class="base"><span></span></div>
    </div>
  </div>
</div></body></html>
