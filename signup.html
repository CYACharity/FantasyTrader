<!DOCTYPE html>
<html>
<head>
    <!-- ft-canvas: the page background, declared before anything that can
         block rendering. Every stylesheet on this page is render-blocking,
         so when one is slow Chrome gives up holding the previous frame and
         paints the default canvas — white — for a beat. That was the flash
         between pages. Inline and first, it can never be white. -->
    <style>html{background-color:#171310;}</style>
    <!-- how the link looks when someone shares it -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Fantasy Trader">
    <meta property="og:url" content="https://fantasytrader.co/">
    <meta property="og:title" content="Come play Fantasy Trader">
    <meta property="og:description" content="Fantasy football, but your players are real companies. Draft stocks, run $100,000, and beat your friends head-to-head every week. Free, no real money.">
    <meta property="og:image" content="https://fantasytrader.co/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Fantasy Trader — draft real stocks, beat your friends">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Come play Fantasy Trader">
    <meta name="twitter:description" content="Fantasy football, but your players are real companies. Draft stocks, run $100,000, and beat your friends every week.">
    <meta name="twitter:image" content="https://fantasytrader.co/og-image.jpg">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#171310">
    <title>Sign Up - Fantasy Trader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap');

        /* ── Auth, in the survey's visual language ──────────────────────
           Same palette and components as survey.html so signing in and the
           questionnaire that follows read as one flow: drifting grid, blurred
           colour glows, gradient wordmark, 12px fields with a green focus
           ring. The canvas sits a stop darker than the survey (#141110 vs
           #1a1714) — this is the first screen anyone sees, and the extra
           depth makes the card lift off it. */
        :root {
            --primary: #4a6785;
            --accent: #e0a24c;
            --success: #5cb88a;
            --danger: #d9645c;
            --background: #141110;
            --surface: #1a1714;
            --text-primary: #ffffff;
            --text-secondary: #8899aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ── Animated background (survey) ── */
        .modern-background { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .grid-overlay {
            position: absolute; width: 200%; height: 200%;
            background-image:
                linear-gradient(rgba(236, 226, 214, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(236, 226, 214, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 30s linear infinite;
        }
        @keyframes gridMove {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }
        .bg-glow {
            position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.12;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        .bg-glow-1 { width: 500px; height: 500px; background: var(--success); top: -12%; left: -6%; }
        .bg-glow-2 { width: 400px; height: 400px; background: var(--primary); bottom: -12%; right: -6%; animation-delay: 4s; }
        .bg-glow-3 { width: 300px; height: 300px; background: var(--accent); top: 50%; left: 50%;
                     transform: translate(-50%, -50%); animation-delay: 2s; opacity: 0.05; }
        @keyframes pulseGlow {
            0%   { transform: scale(1);    opacity: 0.09; }
            100% { transform: scale(1.15); opacity: 0.16; }
        }
        @media (prefers-reduced-motion: reduce) {
            .grid-overlay, .bg-glow { animation: none; }
        }

        /* ── Back ── */
        .back-btn {
            position: fixed; top: 22px; left: 22px; z-index: 5;
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 0.95rem;
            font: 500 0.85rem 'Inter', sans-serif;
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* ── Layout ── */
        .main-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            animation: fadeSlideIn 0.5s ease;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-container { text-align: center; margin-bottom: 1.5rem; }
        .logo-image { width: 92px; height: auto; margin: 0 auto 0.9rem; display: block; }

        .auth-kicker {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--success); font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; font-size: 0.65rem;
            margin-bottom: 0.7rem;
            background: rgba(236, 226, 214, 0.08);
            padding: 6px 14px; border-radius: 999px;
            border: 1px solid rgba(236, 226, 214, 0.15);
        }
        .auth-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.9rem; font-weight: 800; line-height: 1.15;
            background: linear-gradient(135deg, #ffffff 30%, var(--success) 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }
        .subtitle {
            color: var(--text-secondary); font-size: 0.85rem; line-height: 1.5;
            letter-spacing: 0; text-transform: none;
        }

        /* ── Card ── */
        .auth-container {
            background: linear-gradient(160deg, rgba(26, 23, 20, 0.9), rgba(6, 11, 17, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 1.6rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        /* ── Tabs ── */
        .auth-tabs {
            display: flex; gap: 0.4rem;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px; padding: 4px;
            margin-bottom: 1.4rem;
        }
        .auth-tab {
            flex: 1; padding: 0.7rem 1rem;
            border: none; border-radius: 10px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font: 700 0.82rem 'Inter', sans-serif;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .auth-tab:hover { color: rgba(255, 255, 255, 0.8); }
        .auth-tab.active {
            background: linear-gradient(135deg, var(--success), #4fa87b);
            color: #10201a;
            box-shadow: 0 6px 18px rgba(92, 184, 138, 0.22);
        }

        /* ── Forms ── */
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeSlideIn 0.35s ease; }

        .form-group { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1rem; }

        .form-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
        }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.25); }
        .form-input:focus {
            outline: none;
            border-color: var(--success);
            background: rgba(236, 226, 214, 0.04);
            box-shadow: 0 0 0 3px rgba(92, 184, 138, 0.13);
        }

        .submit-btn {
            width: 100%;
            padding: 0.95rem 1.5rem;
            margin-top: 0.4rem;
            border: none; border-radius: 14px;
            background: linear-gradient(135deg, var(--success), #4fa87b);
            color: var(--background);
            font: 700 0.88rem 'Inter', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(92, 184, 138, 0.22);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(92, 184, 138, 0.28); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

        .auth-foot {
            margin-top: 1.1rem; text-align: center;
            font-size: 0.76rem; color: rgba(255,255,255,0.35);
        }

        @media (max-width: 520px) {
            body { padding: 1.5rem 1rem; }
            .main-container { max-width: 100%; }
            .auth-container { padding: 1.25rem; border-radius: 16px; }
            .auth-title { font-size: 1.6rem; }
            .logo-image { width: 78px; }
            .back-btn { top: 14px; left: 14px; }
        }
        @media (max-height: 760px) {
            .logo-image { width: 72px; margin-bottom: 0.6rem; }
            .auth-kicker { margin-bottom: 0.5rem; }
            .auth-title { font-size: 1.6rem; }
            .logo-container { margin-bottom: 1.1rem; }
        }
    </style>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <!-- Same background stack as the survey: a slowly drifting grid with three
         blurred colour glows behind it. -->
    <div class="modern-background">
        <div class="grid-overlay"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="bg-glow bg-glow-3"></div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="back-btn">← Back</a>

    <!-- Main Content -->
    <div class="main-container">
        <div class="logo-container">
            <img class="logo-image" src="ChatGPT_Image_Sep_10__2025__12_10_53_AM-removebg-preview.png" alt="Fantasy Trader logo">
            <div class="auth-kicker" id="authKicker">Beta</div>
            <h1 class="auth-title" id="authTitle">Welcome back</h1>
            <div class="subtitle" id="authSub">Sign in to pick up where you left off.</div>
        </div>

        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
                </div>
                <div id="loginError" style="color:var(--danger);font-size:.85rem;margin-bottom:10px;display:none;"></div>
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <!-- Sign Up Form -->
            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="signupName" class="form-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" class="form-input" placeholder="Pick a unique username" required minlength="3" maxlength="20" autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="signupEmail" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="signupPassword" class="form-input" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="signupConfirm" class="form-input" placeholder="Confirm your password" required>
                </div>
                <div id="signupError" style="color:var(--danger);font-size:.85rem;margin-bottom:10px;display:none;"></div>
                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" id="tutorialOption" style="margin-right: 8px;">
                        Take quick tutorial after signup
                    </label>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/sl.js"></script>
    <script>
        function switchTab(tab) {
            // Remove active class from all tabs and forms
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            // Add active class to clicked tab
            event.target.classList.add('active');
            
            // Show corresponding form
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('signupForm').classList.add('active');
            }
            setAuthCopy(tab);
        }

        /* The heading speaks to whichever tab is open — returning players get
           "Welcome back", new ones get the pitch. Guarded so it's harmless if
           the header markup ever changes. */
        function setAuthCopy(tab) {
            const t = document.getElementById('authTitle');
            const s = document.getElementById('authSub');
            if (!t || !s) return;
            if (tab === 'signup') {
                t.textContent = 'Create your account';
                s.textContent = 'Two minutes to your first draft. No real money, ever.';
            } else {
                t.textContent = 'Welcome back';
                s.textContent = 'Sign in to pick up where you left off.';
            }
        }

        function showErr(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg; el.style.display = 'block';
        }

        // Auto-login ONLY when someone came here to sign in (?mode=login).
        // If they clicked "Get started" / "Start a league" the intent is to
        // CREATE an account — maybe for a friend on a shared laptop — so always
        // show the form. Escape hatch: ?switch=1 forces the form either way.
        (async () => {
            const q = new URLSearchParams(location.search);
            if (q.has('switch')) return;
            if (q.get('mode') !== 'login') return;   // signup intent — never redirect
            try {
                if (SL.configured && await SL.currentUser()) {
                    const d = (() => { try { const v = sessionStorage.getItem('sl_after_login');
                        sessionStorage.removeItem('sl_after_login'); return v; } catch (e) { return null; } })();
                    window.location.replace(d || 'dashboard.html');
                }
            } catch (e) { /* not signed in — show the form */ }
        })();

        // ---- LOGIN ----
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('loginError').style.display = 'none';
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const afterLogin = (() => { try { const d = sessionStorage.getItem('sl_after_login'); sessionStorage.removeItem('sl_after_login'); return d; } catch (e) { return null; } })();
            // Logging in means the account already exists — never re-run onboarding.
            // (This used to check localStorage, which is per-BROWSER, so signing in
            //  from a new device or a private window replayed the whole survey.)
            const dest = afterLogin || 'dashboard.html';
            if (!SL.configured) { window.location.href = dest; return; } // demo mode
            try {
                await SL.signIn(email, password);
                window.location.href = dest;
            } catch (err) {
                showErr('loginError', err.message || 'Login failed.');
            }
        });

        // ---- SIGN UP ----
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('signupError').style.display = 'none';
            const name = document.getElementById('signupName').value.trim();
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const tutorialOption = document.getElementById('tutorialOption').checked;

            if (password !== confirm) { showErr('signupError', 'Passwords do not match.'); return; }
            if (password.length < 6)  { showErr('signupError', 'Password must be at least 6 characters.'); return; }
            if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) { showErr('signupError', 'Username must be 3-20 characters — letters, numbers, and underscores only.'); return; }
            localStorage.setItem('showTutorial', tutorialOption);

            if (!SL.configured) { window.location.href = 'survey.html'; return; } // demo mode
            try {
                // Usernames are unique — check availability first.
                const { data: taken } = await SL.client.from('profiles')
                    .select('id').ilike('username', username).maybeSingle();
                if (taken) { showErr('signupError', 'That username is taken — try another.'); return; }
                localStorage.setItem('username', username);

                const res = await SL.signUpFull(email, password, name, username);
                // Session exists (email confirmation off) -> survey, then the tutorial.
                if (res.session) {
                    window.location.href = 'survey.html';
                } else {
                    showErr('signupError', 'Account created! Check your email to confirm, then log in.');
                    switchTabTo('login');
                }
            } catch (err) {
                showErr('signupError', err.message || 'Sign up failed.');
            }
        });

        function switchTabTo(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active');
            }
            // This path is used for deep links like ?mode=login, so the
            // heading has to follow it too — not just the tab click.
            setAuthCopy(tab);
        }
    </script>
</body>
</html>
