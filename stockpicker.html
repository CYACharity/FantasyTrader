<!DOCTYPE html>
<html>
<head>
    <title>Select Your Stocks</title>
    <style>
        :root {
            --primary: #4a6785;
            --secondary: #6aa08d;
            --accent: #e0a24c;
            --background: #1a1714;
            --surface: #241f1b;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--background) 0%, #0A1128 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .picker-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .sector-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sector-title {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .sector-description {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 1.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin: 1rem 0;
            border-radius: 2px;
        }

        .progress {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stock-card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .stock-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .stock-card.selected {
            border-color: var(--secondary);
            background: rgba(71,169,146,0.2);
        }

        .sp-ident { display: flex; align-items: center; gap: 10px; min-width: 0; }

        .stock-symbol {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .stock-name {
            color: rgba(255,255,255,0.7);
            margin: 0.5rem 0;
        }

        .stock-price {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }

        .stock-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
        }

        .navigation {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
        }

        .nav-button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .next-button {
            background: var(--accent);
            color: black;
        }

        .back-button {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .selection-count {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--surface);
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }
    </style>
    <link rel="stylesheet" href="css/theme.css">

    <script src="js/supabase-config.js"></script>

    <script src="js/stock-logo.js"></script>
</head>

        function displaySectorStocks(sector) {
            console.log('Current sector:', sector);
            console.log('Available stocks:', sectorStocks[sector]);
            
            document.getElementById('currentSector').textContent = 
                `Select stocks from ${sector.replace('_', ' ')} (${currentSectorIndex + 1}/${sectors.length})`;
            
            const stocksGrid = document.getElementById('stocksGrid');
            stocksGrid.innerHTML = '';
            
            if (!sectorStocks[sector]) {
                console.error(`No stocks found for sector: ${sector}`);
                return;
            }
            
            sectorStocks[sector].forEach(symbol => {
                const details = stockDetails[symbol] || { 
                    name: 'Unknown',
                    price: 0,
                    marketCap: 'N/A',
                    pe: 'N/A'
                };
                
                const card = document.createElement('div');
                card.className = `stock-card ${selectedStocks[sector]?.some(s => s.symbol === symbol) ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="sp-ident">
                        ${window.logoHtml ? window.logoHtml(symbol, sector) : ''}
                        <div class="stock-symbol">${symbol}</div>
                    </div>
                    <div class="stock-name">${details.name}</div>
                    <div class="stock-price">$${details.price.toFixed(2)}</div>
                    <div class="stock-stats">
                        <div>Market Cap: ${details.marketCap}</div>
                        <div>P/E: ${details.pe}</div>
                    </div>
                `;
                card.onclick = () => toggleStock(sector, { symbol, ...details });
                stocksGrid.appendChild(card);
            });
            
            updateSelectionCount();
            updateProgress();
        }

        function toggleStock(sector, stock) {
            if (!selectedStocks[sector]) selectedStocks[sector] = [];
            const index = selectedStocks[sector].findIndex(s => s.symbol === stock.symbol);
            
            if (index === -1 && selectedStocks[sector].length < 5) {
                selectedStocks[sector].push({
                    symbol: stock.symbol,
                    name: stock.name,
                    price: stock.price,
                    marketCap: stock.marketCap,
                    pe: stock.pe,
                    sector: sector,
                    shares: 0
                });
            } else if (index !== -1) {
                selectedStocks[sector].splice(index, 1);
            }
            
            updateSelectionCount();
            document.querySelectorAll('.stock-card').forEach(card => {
                const symbol = card.querySelector('.stock-symbol').textContent;
                card.classList.toggle('selected', 
                    selectedStocks[sectors[currentSectorIndex]]?.some(s => s.symbol === symbol));
            });

            localStorage.setItem('selectedStocks', JSON.stringify(selectedStocks));
        }

        function updateSelectionCount() {
            const currentSector = sectors[currentSectorIndex];
            document.getElementById('selectionCount').textContent = 
                selectedStocks[currentSector]?.length || 0;
        }

        document.getElementById('nextButton').onclick = () => {
            if (currentSectorIndex < sectors.length - 1) {
                currentSectorIndex++;
                displaySectorStocks(sectors[currentSectorIndex]);
            } else {
                // Add all selected stocks to watchlist
                const watchlist = [];
                Object.keys(selectedStocks).forEach(sector => {
                    selectedStocks[sector].forEach(stock => {
                        watchlist.push({
                            symbol: stock.symbol,
                            name: stock.name,
                            price: stock.price,
                            sector: sector,
                            addedDate: new Date().toISOString()
                        });
                    });
                });
                localStorage.setItem('watchlist', JSON.stringify(watchlist));
                
                const portfolioData = {
                    stocks: selectedStocks,
                    cash: 100000,
                    totalValue: 100000,
                    lastUpdated: new Date().toISOString()
                };
                
                localStorage.setItem('portfolioData', JSON.stringify(portfolioData));
                
                // Check if user wants tutorial
                const showTutorial = localStorage.getItem('showTutorial') === 'true';
                if (showTutorial) {
                    localStorage.removeItem('showTutorial'); // Clear the flag
                    window.location.href = 'tutorial.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        };

        document.getElementById('backButton').onclick = () => {
            if (currentSectorIndex > 0) {
                currentSectorIndex--;
                displaySectorStocks(sectors[currentSectorIndex]);
            }
        };

        // Initialize with first sector
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Loaded preferences:', preferences);
            console.log('Available sectors:', sectors);
            
            if (sectors && sectors.length > 0) {
                displaySectorStocks(sectors[0]);
            } else {
                document.getElementById('currentSector').textContent = 'No sectors selected';
            }
        });

        function saveChosenStock(stock) {
            const chosenStocks = JSON.parse(localStorage.getItem('chosenStocks')) || [];
            // Check if stock is already chosen
            if (!chosenStocks.some(s => s.symbol === stock.symbol)) {
                chosenStocks.push({
                    symbol: stock.symbol,
                    name: stock.name,
                    price: stock.price
                });
                localStorage.setItem('chosenStocks', JSON.stringify(chosenStocks));
            }
        }
